<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheat sheet builder — Allen Connectomics Glossary</title>
<meta name="description" content="Pick terms, edit them, and place them by hand on printed pages.">
<style>
  :root{
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --ink:#161b22; --muted:#4b5563; --faint:#8b93a0; --line:#dde2e8; --line2:#c7cdd6;
    --paper:#ffffff; --panel:#f4f6f8; --accent:#0d7d88; --accent-ink:#0a5a63;
    --app-bg:#e7ebf0; --chrome:#11161d; --chrome-ink:#e7edf3; --chrome-mut:#9aa4b2;
    --sel:#0d7d88; --danger:#c0392b;
    /* colour inside an illustration means anatomy and nothing else */
    --neuron:#39424f; --axon:#b07a2b; --dendrite:#3f6fa8; --synapse:#c04a6e;
    --error:#c0392b; --ok:#2a8f57; --scaffold:#7c8695;
    --st-functional:var(--ok);
    --surface:#ffffff; --surface-2:#f4f6f8; --border:#dde2e8; --border-strong:#c7cdd6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--app-bg);color:var(--ink);font-family:var(--font-sans);font-size:14px}
  svg text{font-family:var(--font-sans)} svg .mono{font-family:var(--font-mono)}

  /* ---------- chrome / stepper ---------- */
  .chrome{position:sticky;top:0;z-index:100;background:var(--chrome);color:var(--chrome-ink);border-bottom:1px solid #000}
  .chrome-in{max-width:1180px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .chrome h1{font-size:.95rem;margin:0;font-weight:700;letter-spacing:-.01em}
  .chrome h1 .em{color:var(--accent)}
  .steps{display:flex;gap:.3rem;margin-left:.5rem}
  .step{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--chrome-mut);background:transparent;border:1px solid #2a323d;border-radius:999px;padding:.3rem .7rem;cursor:pointer}
  .step .n{font-family:var(--font-mono);font-size:.66rem;width:1.15rem;height:1.15rem;border-radius:50%;display:grid;place-items:center;background:#2a323d;color:var(--chrome-ink)}
  .step.active{color:var(--chrome-ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,transparent)}
  .step.active .n{background:var(--accent)}
  .step.done .n{background:var(--st-functional)}
  .chrome .spacer{margin-left:auto}
  .btn{font-family:var(--font-sans);font-size:.8rem;border-radius:7px;padding:.4rem .8rem;border:1px solid var(--border-strong);background:var(--paper);color:var(--ink);cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--chrome-ink);border-color:#2a323d}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{font-size:.72rem;padding:.25rem .55rem}

  .view{max-width:1180px;margin:0 auto;padding:1rem}
  .view[hidden]{display:none}
  .toolbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;position:sticky;top:3.1rem;z-index:40}
  .toolbar input[type=search]{font-family:var(--font-sans);font-size:.82rem;border:1px solid var(--border-strong);border-radius:7px;padding:.35rem .6rem;min-width:180px}
  .toolbar .count{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
  .catfilters{display:flex;gap:.25rem;flex-wrap:wrap}
  .catf{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.03em;border:1px solid var(--line2);border-radius:999px;padding:.2rem .5rem;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:.3rem;background:var(--paper)}
  .catf i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .catf.off{opacity:.35}

  /* ---------- select grid ---------- */
  .selgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem}
  .selcard{position:relative;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--cc,var(--line2));border-radius:9px;padding:.55rem .6rem;cursor:pointer;display:flex;flex-direction:column;gap:.3rem;transition:box-shadow .1s}
  .selcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .selcard.on{outline:2px solid var(--sel);outline-offset:-1px;border-left-color:var(--sel)}
  .selcard .chk{position:absolute;top:.4rem;right:.4rem;width:1.15rem;height:1.15rem;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--paper);display:grid;place-items:center;font-size:.7rem;color:#fff}
  .selcard.on .chk{background:var(--sel);border-color:var(--sel)}
  .selcard .eb{font-family:var(--font-mono);font-size:.55rem;font-weight:700;letter-spacing:.05em;color:var(--cc,var(--muted))}
  .selcard .nm{font-size:.86rem;font-weight:700;line-height:1.1;padding-right:1.2rem}
  .selcard .df{font-size:.72rem;color:var(--muted);line-height:1.25;max-height:3.8em;overflow:hidden}
  .selcard .art{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px 3px}
  .selcard .art svg{display:block;width:100%;height:auto}
  .selcard .df code{font-family:var(--font-mono);font-size:.66rem;background:var(--panel);padding:0 .2em;border-radius:3px}
  .selcard.special{border-style:dashed}

  /* ---------- edit list ---------- */
  .editlist{display:flex;flex-direction:column;gap:.55rem}
  .editrow{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--cc,var(--line2));border-radius:9px;padding:.6rem .7rem;display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:start}
  .editrow .ord{display:flex;flex-direction:column;gap:.15rem}
  .editrow .ord .btn{padding:.1rem .4rem;font-size:.7rem;line-height:1}
  .editrow .fields{display:flex;flex-direction:column;gap:.35rem;min-width:0}
  .editrow .eb{font-family:var(--font-mono);font-size:.58rem;font-weight:700;letter-spacing:.05em;color:var(--cc,var(--muted))}
  .editrow input.nm{font:700 .9rem var(--font-sans);border:1px solid var(--border-strong);border-radius:6px;padding:.3rem .5rem}
  .editrow textarea.df{font:.8rem/1.35 var(--font-sans);border:1px solid var(--border-strong);border-radius:6px;padding:.35rem .5rem;resize:vertical;min-height:2.4rem}
  .editrow .side{display:flex;flex-direction:column;gap:.35rem;align-items:flex-end;min-width:110px}
  .editrow .art{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px 3px;width:110px}
  .editrow .art svg{display:block;width:100%;height:auto}
  .editrow label.tog{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:.3rem;cursor:pointer}
  .editrow.hidden-diag .art{opacity:.3}

  /* ---------- arrange ---------- */
  .arrbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;position:sticky;top:3.1rem;z-index:60;margin-bottom:.8rem}
  .arrbar .sep{width:1px;height:1.3rem;background:var(--line2)}
  .arrbar .fitmsg{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
  .arrbar .fitmsg.over{color:var(--danger);font-weight:700}
  .arrbar .fitmsg.ok{color:var(--st-functional);font-weight:700}
  .margctl{display:flex;align-items:center;gap:.3rem;font-size:.72rem;color:var(--muted)}
  .margctl input[type=range]{width:68px}
  .selbox-tools{display:flex;align-items:center;gap:.4rem;font-size:.74rem;color:var(--muted)}
  .selbox-tools input[type=range]{width:120px}
  .pages{display:flex;flex-direction:column;align-items:center;gap:1.2rem;padding-bottom:3rem}
  .pagewrap{display:flex;flex-direction:column;gap:.25rem;align-items:center}
  .pagelbl{font-family:var(--font-mono);font-size:.66rem;color:var(--muted)}
  .page{width:8.5in;height:11in;background:var(--paper);box-shadow:0 3px 18px rgba(0,0,0,.28);position:relative;overflow:hidden}
  .page-inner{position:absolute;top:var(--pg-vm,.4in);right:var(--pg-hm,.4in);bottom:var(--pg-vm,.4in);left:var(--pg-hm,.4in)}
  .page.over .page-inner{outline:2px dashed var(--danger);outline-offset:6px}
  .box{position:absolute;transform-origin:top left;cursor:grab;touch-action:none}
  .box.dragging{cursor:grabbing;z-index:9999!important}
  .box.selected .content{outline:2px solid var(--sel);outline-offset:2px}
  .box .content{border:1px solid var(--line);border-left:3px solid var(--cc,var(--line2));border-radius:7px;background:var(--paper);padding:4px 6px 6px;overflow:hidden}
  .box .content .eb{font-family:var(--font-mono);font-size:6.5px;font-weight:700;letter-spacing:.05em;color:var(--cc,var(--muted))}
  .box .content .nm{font-size:11px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
  .box .content .df{font-size:8.5px;color:var(--muted);line-height:1.25;margin-top:1px}
  .box .content .df code{font-family:var(--font-mono);font-size:7.5px;background:var(--panel);padding:0 .2em;border-radius:3px}
  .box .content .art{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:2px 3px;margin-top:2px}
  .box .content .art svg{display:block;width:100%;height:auto}
  .box .rh{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;border-radius:3px;background:var(--sel);border:2px solid #fff;cursor:nwse-resize;display:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .box.selected .rh{display:block}
  .box .pgbadge{position:absolute;left:-6px;top:-6px;width:16px;height:16px;border-radius:50%;background:var(--chrome);color:#fff;font:700 8px var(--font-mono);display:none;place-items:center}
  .box.selected .pgbadge{display:grid}

  /* special content renders */
  /* table catalogue block — grouped by what a table records, no ordering implied */
  .content.special .tblblock{columns:2 1.5in;column-gap:6px}
  .content.special .tbg{break-inside:avoid;display:inline-block;width:100%;margin-bottom:4px}
  .content.special .tbh{font-family:var(--font-mono);font-size:5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin-bottom:1.5px}
  .content.special .tbr{border-left:2px solid var(--line2);padding-left:3px;margin-bottom:1.5px}
  .content.special .tbn{font-family:var(--font-mono);font-size:5px;font-weight:700;line-height:1.15;word-break:break-all}
  .content.special .tbk{font-family:var(--font-mono);font-size:4.2px;color:var(--faint);line-height:1.15;word-break:break-word}
  .content.special pre.pandas{margin:0;background:#0e141b;color:#dbe4ee;border-radius:5px;padding:5px 6px;overflow:hidden;font-family:var(--font-mono);font-size:6.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .content.special pre.pandas .c{color:#7b8798}.content.special pre.pandas .fn{color:#5fd0dd}.content.special pre.pandas .s{color:#e3a56b}
  .content.special .notesgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
  .content.special .notesgrid div{font-size:6.5px;color:var(--muted);line-height:1.25}
  .content.special .notesgrid b{font-family:var(--font-mono);font-size:5.8px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);display:block}
  .content.special .notesgrid code{font-family:var(--font-mono);background:var(--panel);padding:0 .2em;border-radius:3px}

  .empty{padding:3rem 1rem;text-align:center;color:var(--muted)}
  .empty .big{font-size:1.1rem;color:var(--ink);margin-bottom:.4rem}

  @media print{
    @page{size:letter portrait;margin:0}
    html,body{background:#fff}
    .chrome,.arrbar,.toolbar{display:none!important}
    .view{max-width:none;margin:0;padding:0}
    .pages{gap:0;padding:0}
    .pagewrap{gap:0}
    .pagelbl{display:none}
    .page{box-shadow:none;page-break-after:always;width:8.5in;height:11in}
    .pagewrap:last-child .page{page-break-after:auto}
    .box .rh,.box .pgbadge{display:none!important}
    .box.selected .content{outline:none}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

</style>
</head>
<body>

<div class="chrome">
  <div class="chrome-in">
    <h1><span class="em">Cheat sheet</span> builder</h1>
    <div class="steps">
      <button class="step active" data-step="0" id="st0"><span class="n">1</span>Select</button>
      <button class="step" data-step="1" id="st1"><span class="n">2</span>Edit</button>
      <button class="step" data-step="2" id="st2"><span class="n">3</span>Arrange &amp; print</button>
    </div>
    <div class="spacer"></div>
    <a class="btn ghost sm" href="#" onclick="return false" title="not available in the single-file bundle">← Glossary</a>
    <button class="btn ghost sm" id="resetBtn" title="Clear all selections and edits">Reset</button>
    <button class="btn primary" id="nextBtn">Next: Edit →</button>
  </div>
</div>

<!-- STEP 1 -->
<section class="view" id="view0">
  <div class="toolbar">
    <input type="search" id="search" placeholder="Search terms…" aria-label="Search terms">
    <div class="catfilters" id="catfilters"></div>
    <span class="spacer" style="flex:1"></span>
    <button class="btn sm" id="selAll">Select all shown</button>
    <button class="btn sm" id="selNone">Clear</button>
    <span class="count" id="selCount">0 selected</span>
  </div>
  <div class="selgrid" id="selgrid"></div>
</section>

<!-- STEP 2 -->
<section class="view" id="view1" hidden>
  <div class="toolbar">
    <span class="count" id="editCount">0 boxes</span>
    <span style="color:var(--muted);font-size:.78rem">Edit the name and definition of each box; reorder with ↑↓; toggle its diagram. Changes autosave.</span>
  </div>
  <div class="editlist" id="editlist"></div>
</section>

<!-- STEP 3 -->
<section class="view" id="view2" hidden>
  <div class="arrbar">
    <button class="btn sm" id="autoAll">Auto-arrange</button>
    <button class="btn sm" id="autoFit">Auto-fit</button>
    <div class="sep"></div>
    <span class="margctl">Pages
      <button class="btn sm" id="delPage" title="Remove the last page">−</button>
      <span id="pageCount" style="font-family:var(--font-mono);min-width:4rem">2 pages</span>
      <button class="btn sm" id="addPage" title="Add a page">+</button>
    </span>
    <div class="sep"></div>
    <label class="margctl">Side <input type="range" id="hMargin" min="0.10" max="1.0" step="0.05" value="0.40"> <span id="hMarginVal" style="font-family:var(--font-mono);min-width:2.8rem">0.40″</span></label>
    <label class="margctl">Top/btm <input type="range" id="vMargin" min="0.10" max="1.0" step="0.05" value="0.40"> <span id="vMarginVal" style="font-family:var(--font-mono);min-width:2.8rem">0.40″</span></label>
    <div class="sep"></div>
    <div class="selbox-tools" id="selTools" style="visibility:hidden">
      <span id="selName">—</span>
      <label>scale <input type="range" id="scaleRange" min="0.4" max="2" step="0.05" value="1"></label>
      <span id="scaleVal" style="font-family:var(--font-mono)">1.00×</span>
      <select id="toPage" aria-label="Move to page"></select>
      <button class="btn sm" id="toFront">Front</button>
    </div>
    <span class="spacer" style="flex:1"></span>
    <span class="fitmsg" id="fitMsg"></span>
    <div class="sep"></div>
    <button class="btn primary sm" id="printBtn">Print / Save PDF</button>
  </div>
  <div class="pages" id="pages"></div>
</section>

<script>
// config.js — datasets, categories, and the colour rules for the whole site.
// Plain data. Edit values freely; leave the "window.X =" wrappers alone so the
// files keep working when index.html is opened straight off disk (file://).

window.SITE = {
  title: "Allen Connectomics Glossary",
  // shown in the footer; bump when you make a change worth flagging to readers
  revision: "2026-07",
  databook: "https://allenswdb.github.io/anatomy/microns-em/em-background.html",
  // the Community tab opens this in a new tab; clear it to drop the tab
  community: "https://community.brain-map.org/",
};

window.DATASETS = {
  microns: {
    label: "MICrONS",
    blurb: "Cubic-millimetre serial-section EM of mouse visual cortex (VISp / VISal / VISrl), with matched two-photon calcium imaging.",
    datastack: "minnie65_public",
    server: "global.daf-apis.com",
    resolution: "4 × 4 × 40 nm",
    version: "v1507",
    synapses: "synapses_pni_2",
    ng: "https://spelunker.cave-explorer.org/#!middleauth+https://global.daf-apis.com/nglstate/api/v1/4658335189041152",
  },
  v1dd: {
    label: "V1DD",
    blurb: "V1 Deep-Dive: 800 × 800 µm of primary visual cortex spanning pia to white matter, imaged in 4 mice; EM in the same tissue.",
    datastack: "v1dd_public",
    server: "global.em.brain.allentech.org",
    resolution: "9 × 9 × 45 nm",
    version: "v1196",
    synapses: "synapses_v1dd",
    ng: "https://spelunker.cave-explorer.org/#!middleauth+https://global.em.brain.allentech.org/nglstate/api/v1/6116368998989824",
  },
};

// Colour is used for exactly one thing in the glossary: which category a term
// belongs to. Nothing else on the page borrows these hues. See README.
window.CATEGORIES = [
  { id: "datasets",       label: "Datasets & scope",            short: "DATASETS", color: "#0e7f8c" },
  { id: "imaging",        label: "Imaging & ultrastructure",    short: "IMAGING",  color: "#8a6f4a" },
  { id: "volume",         label: "Volume, voxels & coordinates",short: "VOLUME",   color: "#2f6fd0" },
  { id: "segmentation",   label: "Segmentation & reconstruction",short:"SEGMENT",  color: "#6d55e0" },
  { id: "morphology",     label: "Morphology — meshes & skeletons", short: "MORPH", color: "#2a8f57" },
  { id: "proofreading",   label: "Proofreading & data quality", short: "PROOF",    color: "#b8791a" },
  { id: "cave",           label: "CAVE — access & versioning",  short: "CAVE",     color: "#0f766e" },
  { id: "tables",         label: "Annotation tables, IDs & queries", short: "TABLES", color: "#9333ea" },
  { id: "celltypes",      label: "Cell types & cortical anatomy", short: "CELLTYPE", color: "#c9357f" },
  { id: "connectivity",   label: "Connectivity & synapses",     short: "CONNECT",  color: "#d1462c" },
  { id: "functional",     label: "Functional data & coregistration", short: "FUNCTION", color: "#9a5b12" },
  { id: "tools",          label: "Visualisation tools",         short: "TOOLS",    color: "#526278" },
];

// Colours inside the illustrations mean anatomy, never category. Four roles,
// deliberately a different visual family from the category hues above.
window.ANATOMY = [
  { id: "scaffold", label: "structure / volume" },
  { id: "dendrite", label: "dendrite" },
  { id: "axon",     label: "axon" },
  { id: "synapse",  label: "synapse" },
];

</script>
<script>
// terms.js — glossary entries, one object per term
// Plain data. Everything below the first line is JSON — edit it like JSON and
// leave the "window.X =" wrapper alone so the file keeps working over file://.
window.TERMS = [
  {"id":"3d-reconstruction","term":"3D reconstruction","category":"segmentation","def":"Turning EM imagery into 3D neuron objects (dense segmentation → meshes).","diagram":"3d-reconstruction","ng":{}},
  {"id":"annotation","term":"Annotation","category":"tables","def":"Labeled data (points/tables) bound to locations or cells in the volume.","diagram":"annotation","ng":{}},
  {"id":"bound-spatial-point","term":"Bound Spatial Point","category":"tables","def":"Binds an annotation to the cell at a location via the triad <code>pt_position</code> → <code>pt_supervoxel_id</code> → <code>pt_root_id</code>.","diagram":"bound-spatial-point","ng":{}},
  {"id":"branch-end-root-point","term":"Branch / End / Root point","category":"morphology","def":"Named skeleton vertex types; the root is conventionally placed at the soma.","diagram":"branch-end-root-point","ng":{}},
  {"id":"cave","term":"CAVE","category":"cave","def":"Connectome Annotation Versioning Engine — the suite managing large dynamic connectomics data.","diagram":"cave","ng":{}},
  {"id":"caveclient","term":"CAVEclient","category":"cave","def":"The main Python client for programmatic access to CAVE services. Servers: MICrONS <code>global.daf-apis.com</code>, V1DD <code>global.em.brain.allentech.org</code>.","ng":{}},
  {"id":"cc-abs-cc-max-cc-norm","term":"cc_abs / cc_max / cc_norm","category":"functional","def":"Digital-twin model-performance columns.","ng":{}},
  {"id":"cell-type","term":"Cell type","category":"celltypes","def":"Classification of a cell (e.g. 23P, BC) via several tables/methods, keyed on nucleus id.","diagram":"cell-type","ng":{}},
  {"id":"cell-id-soma-id","term":"cell_id / soma_id","category":"tables","def":"The 6-digit nucleus id (from <code>nucleus_detection_v0</code>), static across versions; tracks a cell over time.","diagram":"cell-id-soma-id","ng":{}},
  {"id":"classification-system-column","term":"classification_system column","category":"celltypes","def":"The E / I / non-neuron grouping column in cell-type tables.","ng":{}},
  {"id":"clean","term":"Clean","category":"proofreading","def":"Arbor proofread to remove all merge errors (synapses correct, but may be incomplete).","diagram":"clean","ng":{}},
  {"id":"cloud-volume-imageryclient","term":"cloud-volume / ImageryClient","category":"cave","def":"Serverless clients to read Precomputed imagery/segmentation and download aligned cutouts.","ng":{}},

(syn.groupby(["pre_pt_root_id", "post_pt_root_id"])

# valid_id is the root id at the time of assessment — if it differs from the

" y1=\"75\" x2=\"270\" y2=\"75\" stroke=\"var(--accent-ink)\" stroke-opacity=\".7\" stroke-width=\"2\"/><line x1=\"42\" y1=\"92\" x2=\"94\" y2=\"92\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"2\"/><line x1=\"130\" y1=\"92\" x2=\"176\" y2=\"92\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"2\"/><line x1=\"216\" y1=\"92\" x2=\"256\" y2=\"92\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"2\"/><line x1=\"42\" y1=\"109\" x2=\"90\" y2=\"109\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"2\"/><line x1=\"130\" y1=\"109\" x2=\"180\" y2=\"109\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"2\"/><line x1=\"216\" y1=\"109\" x2=\"262\" y2=\"109\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"2\"/><line x1=\"42\" y1=\"127\" x2=\"96\" y2=\"127\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"2\"/><line x1=\"130\" y1=\"127\" x2=\"172\" y2=\"127\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"2\"/><line x1=\"216\" y1=\"127\" x2=\"258\" y2=\"127\" stroke=\"currentColor\" stroke-opacity=\".3\" stroke-width=\"2\"/><rect x=\"166\" y=\"152\" width=\"126\" height=\"24\" rx=\"12\" fill=\"var(--accent)\" fill-opacity=\".18\" stroke=\"var(--accent)\" stroke-width=\"2\"/><text x=\"229\" y=\"168\" text-anchor=\"middle\" font-size=\"9.5\" class=\"mono\" fill=\"var(--accent-ink)\">view in Neuroglancer</text></svg>",

<script>
/* Cheat-sheet builder — manual, drag-and-drop layout onto printed pages.
   Reads the same data/ files as the glossary, so nothing is duplicated here.
   For an auto-flowing sheet that paginates itself, use the Cheat sheet view
   on index.html; this page is for when you want to place things by hand. */

/* ---- adapt the shared data to the builder's flat ITEM list ---- */
const BCAT = Object.fromEntries(
  window.CATEGORIES.map(c => [c.id, {l: c.short, c: c.color}])
    .concat([["special", {l: "BLOCK", c: "#0e7f8c"}]]));

const BW = {term: 180, tables: 400, code: 340, notes: 340};

function esc(s){ return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// one block per dataset: its tables, grouped by what they record.
// No arrows and no ordering — the groups are a finding aid, not a pipeline.
function tablesBlockHTML(dsId){
  const d = window.DATASETS[dsId];
  return `<div class="tblblock">` + window.TABLE_GROUPS.map(g => {
    const rows = window.TABLES[dsId].filter(t => t.group === g.id);
    if(!rows.length) return "";
    return `<div class="tbg"><div class="tbh">${esc(d.label)} · ${esc(g.label)}</div>` +
      rows.map(t => `<div class="tbr"><div class="tbn">${esc(t.name)}</div>` +
        `<div class="tbk">${esc((t.keys||[]).slice(0,4).join(" · "))}` +
        `${t.rows && t.rows !== "\u2014" ? " · " + esc(t.rows) : ""}</div></div>`).join("") +
      `</div>`;
  }).join("") + `</div>`;
}

function codeBlockHTML(snip){
  const src = snip[window.BUILDER_LANG] || snip.python || "";
  const html = esc(src)
    .replace(/(&quot;.*?&quot;|"[^"\n]*"|'[^'\n]*')/g, '<span class="s">$1</span>')
    .replace(/(^|\n)(\s*)(#[^\n]*)/g, '$1$2<span class="c">$3</span>');
  return `<pre class="pandas">${html}</pre>`;
}

const NOTES_HTML = (() => {
  const m = window.DATASETS.microns, v = window.DATASETS.v1dd;
  return `<div class="notesgrid">
  <div><b>Synapse tables</b>MICrONS <code>${m.synapses}</code> · V1DD <code>${v.synapses}</code></div>
  <div><b>CAVE servers</b>MICrONS <code>${m.server}</code> · V1DD <code>${v.server}</code></div>
  <div><b>Datastacks</b><code>${m.datastack}</code> · <code>${v.datastack}</code></div>
  <div><b>Versions</b>MICrONS ${m.version} · V1DD ${v.version}</div>
  <div><b>ID rule</b>nucleus <code>id</code> static; <code>pt_root_id</code> changes with edits</div>
  <div><b>Coordinates</b>annotations in voxels, meshes in nm; y increases with depth</div></div>`;
})();

window.BUILDER_LANG = "python";

const ITEMS = window.TERMS.map(t => ({
  id: "term|" + t.id, type: "term", bw: BW.term,
  cat: t.category, catL: BCAT[t.category].l, cc: BCAT[t.category].c,
  name: t.term, def: t.def,
  svg: t.diagram ? window.DIAGRAMS[t.diagram] : null,
})).sort((a,b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));

ITEMS.unshift(
  ...Object.keys(window.DATASETS).map(dsId => ({
    id: "special|tables-" + dsId, type: "tables", bw: BW.tables, cat: "special",
    catL: "BLOCK", cc: BCAT.special.c,
    name: window.DATASETS[dsId].label + " tables",
    def: "Grouped by what each table records.",
    html: tablesBlockHTML(dsId),
  })),
  ...window.SNIPPETS.map(s => ({
    id: "special|snip-" + s.id, type: "code", bw: BW.code, cat: "special",
    catL: "BLOCK", cc: BCAT.special.c, name: s.title, def: "Recipe.",
    html: codeBlockHTML(s),
  })),
  {id: "special|notes", type: "notes", bw: BW.notes, cat: "special", catL: "BLOCK",
   cc: BCAT.special.c, name: "Canonical notes", def: "Servers, datastacks, ID rules.",
   html: NOTES_HTML},
);

const ITEM=Object.fromEntries(ITEMS.map(i=>[i.id,i]));

/* ============ state ============ */
const LS="emcheat.builder.v1";
let S={ byId:{}, order:[], step:0, fit:1, sel:null, zTop:1, hMargin:0.4, vMargin:0.4, pages:2 };
const MAXPAGES=12;
const pageList=()=>[...Array(S.pages).keys()];
function initItem(id){ if(!S.byId[id]){ const it=ITEM[id]; S.byId[id]={sel:false,name:it.name,def:it.def,diag:!!it.svg,page:0,x:20,y:20,scale:1,z:1}; } return S.byId[id]; }
ITEMS.forEach(i=>initItem(i.id));
function load(){ try{const j=JSON.parse(localStorage.getItem(LS)); if(j&&j.byId){ S=Object.assign(S,j); ITEMS.forEach(i=>initItem(i.id)); }}catch(e){} }
function save(){ try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} }
load();

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ============ STEP 1: SELECT ============ */
let catOff=new Set(); let searchTxt="";
function buildCatFilters(){
  $("#catfilters").innerHTML=Object.entries(BCAT).map(([k,v])=>
    `<span class="catf" data-cat="${k}"><i style="background:${v.c}"></i>${v.l}</span>`).join("");
  $$(".catf").forEach(el=>el.onclick=()=>{const c=el.dataset.cat; if(catOff.has(c)){catOff.delete(c);el.classList.remove("off");}else{catOff.add(c);el.classList.add("off");} renderSelect();});
}
function miniArt(it){ return it.svg?`<div class="art">${it.svg}</div>`:""; }
function renderSelect(){
  const q=searchTxt.toLowerCase();
  const html=ITEMS.filter(it=>!catOff.has(it.cat) && (!q || it.name.toLowerCase().includes(q) || (it.def||"").toLowerCase().includes(q)))
    .map(it=>{
      const st=S.byId[it.id];
      return `<div class="selcard ${st.sel?"on":""} ${it.type!=="term"?"special":""}" data-id="${it.id}" style="--cc:${it.cc}">
        <div class="chk">${st.sel?"✓":""}</div>
        <div class="eb">${it.catL}</div>
        <div class="nm">${st.name}</div>
        ${miniArt(it)}
        <div class="df">${st.def}</div>
      </div>`;
    }).join("");
  $("#selgrid").innerHTML=html || `<div class="empty">No terms match.</div>`;
  $$(".selcard").forEach(c=>c.onclick=()=>toggleSel(c.dataset.id));
  updateSelCount();
}
function toggleSel(id){ const st=S.byId[id]; st.sel=!st.sel;
  if(st.sel){ if(!S.order.includes(id)) S.order.push(id); } else { S.order=S.order.filter(x=>x!==id); if(S.sel===id)S.sel=null; }
  save(); renderSelect();
}
function selectedIds(){ return S.order.filter(id=>S.byId[id] && S.byId[id].sel); }
function updateSelCount(){ const n=selectedIds().length; $("#selCount").textContent=`${n} selected`; $("#editCount").textContent=`${n} boxes`; }

$("#search").oninput=e=>{searchTxt=e.target.value;renderSelect();};
$("#selAll").onclick=()=>{ const q=searchTxt.toLowerCase();
  ITEMS.filter(it=>!catOff.has(it.cat)&&(!q||it.name.toLowerCase().includes(q)||(it.def||"").toLowerCase().includes(q)))
    .forEach(it=>{const st=S.byId[it.id]; if(!st.sel){st.sel=true; if(!S.order.includes(it.id))S.order.push(it.id);}});
  save(); renderSelect(); };
$("#selNone").onclick=()=>{ selectedIds().forEach(id=>S.byId[id].sel=false); S.order=[]; save(); renderSelect(); };

/* ============ STEP 2: EDIT ============ */
function renderEdit(){
  const ids=selectedIds();
  if(!ids.length){ $("#editlist").innerHTML=`<div class="empty"><div class="big">No boxes selected</div>Go back to step 1 and pick some terms.</div>`; return; }
  $("#editlist").innerHTML=ids.map((id,idx)=>{
    const it=ITEM[id], st=S.byId[id];
    const art=it.svg?`<div class="art">${it.svg}</div><label class="tog"><input type="checkbox" data-diag="${id}" ${st.diag?"checked":""}> show diagram</label>`:"";
    return `<div class="editrow ${st.diag?"":"hidden-diag"}" style="--cc:${it.cc}">
      <div class="ord">
        <button class="btn sm" data-up="${idx}" ${idx===0?"disabled":""}>↑</button>
        <button class="btn sm" data-down="${idx}" ${idx===ids.length-1?"disabled":""}>↓</button>
      </div>
      <div class="fields">
        <span class="eb">${it.catL}</span>
        <input class="nm" data-name="${id}" value="${st.name.replace(/"/g,"&quot;")}">
        <textarea class="df" data-def="${id}">${st.def.replace(/</g,"&lt;")}</textarea>
      </div>
      <div class="side">${art}<button class="btn sm" data-rm="${id}" style="color:var(--danger)">Remove</button></div>
    </div>`;
  }).join("");
  $$("[data-name]").forEach(el=>el.oninput=e=>{S.byId[el.dataset.name].name=e.target.value;save();});
  $$("[data-def]").forEach(el=>el.oninput=e=>{S.byId[el.dataset.def].def=e.target.value;save();});
  $$("[data-diag]").forEach(el=>el.onchange=e=>{S.byId[el.dataset.diag].diag=e.target.checked;save();renderEdit();});
  $$("[data-rm]").forEach(el=>el.onclick=()=>{const id=el.dataset.rm;S.byId[id].sel=false;S.order=S.order.filter(x=>x!==id);save();renderEdit();updateSelCount();});
  $$("[data-up]").forEach(el=>el.onclick=()=>{const i=+el.dataset.up;reorder(i,i-1);});
  $$("[data-down]").forEach(el=>el.onclick=()=>{const i=+el.dataset.down;reorder(i,i+1);});
  updateSelCount();
}
function reorder(i,j){ const ids=selectedIds(); const id=ids[i]; ids.splice(i,1); ids.splice(j,0,id);
  const others=S.order.filter(x=>!ids.includes(x)); S.order=[...ids,...others]; save(); renderEdit(); }

/* ============ STEP 3: ARRANGE ============ */
const PGW=8.5*96, PGH=11*96, GAP=8;
function inW(){ return PGW-2*(S.hMargin||0.4)*96; }
function inH(){ return PGH-2*(S.vMargin||0.4)*96; }
function applyMargins(){
  const hm=+(S.hMargin||0.4), vm=+(S.vMargin||0.4);
  document.documentElement.style.setProperty("--pg-hm", hm+"in");
  document.documentElement.style.setProperty("--pg-vm", vm+"in");
  const hs=$("#hMargin"), vs=$("#vMargin");
  if(hs){ hs.value=hm; $("#hMarginVal").textContent=hm.toFixed(2)+'″'; }
  if(vs){ vs.value=vm; $("#vMarginVal").textContent=vm.toFixed(2)+'″'; }
}
function boxContentHTML(id){
  const it=ITEM[id], st=S.byId[id];
  if(it.type==="term"){
    const art=(st.diag&&it.svg)?`<div class="art">${it.svg}</div>`:"";
    return `<div class="content" style="--cc:${it.cc};width:${it.bw}px"><div class="eb">${it.catL}</div><div class="nm">${st.name}</div>${art}<div class="df">${st.def}</div></div>`;
  }
  return `<div class="content special" style="--cc:${it.cc};width:${it.bw}px"><div class="eb">${it.catL}</div><div class="nm">${st.name}</div>${it.html}</div>`;
}
function measure(){ // render offscreen to get natural heights
  const ids=selectedIds(); const ghost=document.createElement("div");
  ghost.style.cssText="position:absolute;left:-99999px;top:0;visibility:hidden";
  ghost.innerHTML=ids.map(id=>`<div class="box" data-mid="${id}">${boxContentHTML(id)}</div>`).join("");
  document.body.appendChild(ghost);
  ids.forEach(id=>{ const c=ghost.querySelector(`[data-mid="${id}"] .content`); S.byId[id]._w=c.offsetWidth; S.byId[id]._h=c.offsetHeight; });
  document.body.removeChild(ghost);
}
function autoArrange(){
  measure();
  const ids=selectedIds(), IW=inW(), IH=inH();
  let page=0,x=0,y=0,shelf=0;
  ids.forEach(id=>{ const st=S.byId[id]; const s=st.scale*S.fit; const w=st._w*s, h=st._h*s;
    if(x>0 && x+w>IW){ x=0; y+=shelf+GAP; shelf=0; }
    if(y+h>IH){ page++; x=0; y=0; shelf=0; }
    st.page=page; st.x=x; st.y=y; x+=w+GAP; shelf=Math.max(shelf,h); });
  S.pages=Math.min(MAXPAGES, Math.max(1, 1+Math.max(0,...ids.map(id=>S.byId[id].page))));
  ids.forEach(id=>{ S.byId[id].page=Math.min(S.byId[id].page, S.pages-1); });
  save(); renderArrange();
}
function autoFit(){
  measure(); let lo=0.4,hi=1.3,best=0.4;
  for(let k=0;k<18;k++){ const mid=(lo+hi)/2; if(fitsWithin(mid,S.pages)){best=mid;lo=mid;}else hi=mid; }
  S.fit=best;
  const ids=selectedIds(), IW=inW(), IH=inH(); let page=0,x=0,y=0,shelf=0;
  ids.forEach(id=>{const st=S.byId[id];const s=st.scale*S.fit,w=st._w*s,h=st._h*s;
    if(x>0&&x+w>IW){x=0;y+=shelf+GAP;shelf=0;} if(y+h>IH){page++;x=0;y=0;shelf=0;}
    st.page=Math.min(page,S.pages-1);st.x=x;st.y=y;x+=w+GAP;shelf=Math.max(shelf,h);});
  save(); renderArrange();
}
function fitsWithin(fit,maxPages){ const ids=selectedIds(), IW=inW(), IH=inH(); let page=0,x=0,y=0,shelf=0;
  for(const id of ids){ const st=S.byId[id]; const s=st.scale*fit,w=st._w*s,h=st._h*s;
    if(w>IW||h>IH) return false;
    if(x>0&&x+w>IW){x=0;y+=shelf+GAP;shelf=0;} if(y+h>IH){page++;x=0;y=0;shelf=0;}
    if(page>maxPages-1) return false; x+=w+GAP; shelf=Math.max(shelf,h); }
  return true;
}
function renderArrange(){
  const ids=selectedIds();
  buildPages();
  pageList().forEach(p=>$(`.page-inner[data-page="${p}"]`).innerHTML="");
  if(!ids.length){ $("#page0 .page-inner").innerHTML=`<div class="empty"><div class="big">Nothing to arrange</div>Select boxes in step 1.</div>`; updateFitMsg(); return; }
  ids.forEach(id=>{
    const it=ITEM[id], st=S.byId[id];
    const inner=$(`.page-inner[data-page="${st.page}"]`); if(!inner)return;
    const box=document.createElement("div"); box.className="box"+(S.sel===id?" selected":"");
    box.dataset.id=id; box.style.left=st.x+"px"; box.style.top=st.y+"px";
    box.style.transform=`scale(${st.scale*S.fit})`; box.style.zIndex=st.z;
    box.style.setProperty("--cc",it.cc);
    box.innerHTML=`<div class="pgbadge">${st.page+1}</div>${boxContentHTML(id)}<div class="rh"></div>`;
    inner.appendChild(box);
    dragify(box,id);
  });
  updateSelTools(); updateFitMsg();
}
function updateFitMsg(){
  const ids=selectedIds(); let over=false;
  $$(".page").forEach(pg=>pg.classList.remove("over"));
  const IW=inW(), IH=inH();
  ids.forEach(id=>{const st=S.byId[id];const s=st.scale*S.fit;const w=st._w*s,h=st._h*s;
    if(st.page>S.pages-1||st.x+w>IW+2||st.y+h>IH+2){ over=true; const pg=$(`#page${Math.min(st.page,S.pages-1)}`); pg&&pg.classList.add("over"); }});
  const n=ids.length;
  const per=pageList().map(p=>ids.filter(i=>S.byId[i].page===p).length);
  const m=$("#fitMsg"); m.className="fitmsg"+(over?" over":(n?" ok":""));
  m.textContent = n? (over? `\u26a0 overflow \u2014 auto-fit, scale down, or add a page` : `fits \u2713 \u00b7 ` + per.map((c,i)=>`p${i+1}:${c}`).join(" \u00b7 ")) : "";
  $("#pageCount").textContent = S.pages + (S.pages===1?" page":" pages");
}
function selectBox(id){ S.sel=id; $$(".box").forEach(b=>b.classList.toggle("selected",b.dataset.id===id)); updateSelTools(); }
function updateSelTools(){
  const t=$("#selTools"); if(!S.sel||!S.byId[S.sel]||!S.byId[S.sel].sel){t.style.visibility="hidden";return;}
  t.style.visibility="visible"; const st=S.byId[S.sel];
  $("#selName").textContent=st.name.slice(0,28); $("#scaleRange").value=st.scale; $("#scaleVal").textContent=st.scale.toFixed(2)+"×";
  $("#toPage").innerHTML = pageList().map(p=>`<option value="${p}"${p===st.page?" selected":""}>page ${p+1}</option>`).join("");
}
function dragify(box,id){
  box.addEventListener("pointerdown",e=>{
    if(e.target.classList.contains("rh")) return;
    selectBox(id); const st=S.byId[id]; const s=st.scale*S.fit;
    const w=st._w*s,h=st._h*s; const sx=e.clientX,sy=e.clientY,ox=st.x,oy=st.y;
    box.classList.add("dragging"); box.setPointerCapture(e.pointerId);
    const mv=ev=>{ st.x=clamp(ox+(ev.clientX-sx),0,Math.max(0,inW()-w)); st.y=clamp(oy+(ev.clientY-sy),0,Math.max(0,inH()-h)); box.style.left=st.x+"px"; box.style.top=st.y+"px"; };
    const up=ev=>{ box.classList.remove("dragging"); box.releasePointerCapture(e.pointerId); box.removeEventListener("pointermove",mv); box.removeEventListener("pointerup",up); save(); updateFitMsg(); };
    box.addEventListener("pointermove",mv); box.addEventListener("pointerup",up);
  });
  box.querySelector(".rh").addEventListener("pointerdown",e=>{
    e.stopPropagation(); selectBox(id); const st=S.byId[id]; const sx=e.clientX, os=st.scale, bw=st._w;
    box.setPointerCapture(e.pointerId);
    const mv=ev=>{ st.scale=clamp(os+(ev.clientX-sx)/bw,0.4,2.5); box.style.transform=`scale(${st.scale*S.fit})`; $("#scaleRange").value=st.scale; $("#scaleVal").textContent=st.scale.toFixed(2)+"×"; };
    const up=ev=>{ box.releasePointerCapture(e.pointerId); box.removeEventListener("pointermove",mv); box.removeEventListener("pointerup",up); save(); updateFitMsg(); };
    box.addEventListener("pointermove",mv); box.addEventListener("pointerup",up);
  });
}
$("#scaleRange").oninput=e=>{ if(!S.sel)return; S.byId[S.sel].scale=+e.target.value; $("#scaleVal").textContent=(+e.target.value).toFixed(2)+"×";
  const box=$(`.box[data-id="${S.sel}"]`); if(box)box.style.transform=`scale(${S.byId[S.sel].scale*S.fit})`; save(); updateFitMsg(); };
$("#toPage").onchange=e=>{ if(!S.sel)return; S.byId[S.sel].page=+e.target.value; save(); renderArrange(); };
$("#addPage").onclick=()=>{ if(S.pages<MAXPAGES){ S.pages++; save(); renderArrange(); } };
$("#delPage").onclick=()=>{ if(S.pages<=1) return;
  S.pages--; selectedIds().forEach(id=>{ S.byId[id].page=Math.min(S.byId[id].page,S.pages-1); });
  save(); renderArrange(); };
$("#toFront").onclick=()=>{ if(!S.sel)return; S.byId[S.sel].z=++S.zTop; save(); renderArrange(); };
$("#autoAll").onclick=()=>{ S.fit=1; autoArrange(); };
$("#autoFit").onclick=autoFit;

// the page canvases are generated, so the count can change at any time
function buildPages(){
  const host=$("#pages");
  if(host.childElementCount===S.pages) return;
  host.innerHTML=pageList().map(p=>
    `<div class="pagewrap"><div class="pagelbl">Page ${p+1}</div>`+
    `<div class="page" id="page${p}"><div class="page-inner" data-page="${p}"></div></div></div>`).join("");
}
$("#hMargin").oninput=e=>{ S.hMargin=+e.target.value; $("#hMarginVal").textContent=(+e.target.value).toFixed(2)+'″'; applyMargins(); save(); renderArrange(); };
$("#vMargin").oninput=e=>{ S.vMargin=+e.target.value; $("#vMarginVal").textContent=(+e.target.value).toFixed(2)+'″'; applyMargins(); save(); renderArrange(); };
function doPrint(){
  /* window.print() is blocked inside sandboxed iframes (e.g. claude.ai artifact viewer).
     Detect the iframe context and guide the user instead. */
  let inFrame=false;
  try{ inFrame=(self!==top); }catch(e){ inFrame=true; }
  if(inFrame){
    alert("Printing is blocked in the embedded preview.\n\nTo print:\n  1. Open the local HTML file directly in your browser\n     (double-click EM-Cheatsheet-Builder.html)\n  2. Navigate to Step 3 (Arrange & Print)\n  3. Click \"Print / Save PDF\" — or press Cmd+P (Mac) / Ctrl+P (Windows)\n\nIn the print dialog: set Paper = US Letter, Orientation = Portrait, enable Background graphics.");
    return;
  }
  window.print();
}
$("#printBtn").onclick=doPrint;

/* ============ step navigation ============ */
function go(step){
  S.step=step; save();
  [0,1,2].forEach(i=>{ $("#view"+i).hidden=(i!==step); const s=$("#st"+i); s.classList.toggle("active",i===step); s.classList.toggle("done",i<step); });
  const nb=$("#nextBtn");
  if(step===0){ nb.textContent="Next: Edit →"; nb.disabled=false; renderSelect(); }
  if(step===1){ nb.textContent="Next: Arrange →"; renderEdit(); }
  if(step===2){ nb.textContent="Print / Save PDF"; applyMargins(); setTimeout(()=>{ if(selectedIds().every(id=>S.byId[id].x===20&&S.byId[id].y===20)) autoArrange(); else { measure(); renderArrange(); } },30); }
}
$("#nextBtn").onclick=()=>{ if(S.step<2) go(S.step+1); else doPrint(); };
$$(".step").forEach(s=>s.onclick=()=>go(+s.dataset.step));
$("#resetBtn").onclick=()=>{ if(confirm("Clear all selections and edits?")){ localStorage.removeItem(LS); location.reload(); } };
$("#pages").addEventListener("pointerdown",e=>{ if(e.target.closest(".page-inner")===e.target){ S.sel=null; $$(".box").forEach(b=>b.classList.remove("selected")); updateSelTools(); } });

buildCatFilters(); go(S.step||0);

</script>
