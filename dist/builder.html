  {"id":"synapses-pni-2-synapses-v1dd","term":"synapses_pni_2 / synapses_v1dd","category":"connectivity","def":"The sole synapse tables (337M / 639M rows).","ng":{}},
  {"id":"table-viewer","term":"Table Viewer","category":"tools","def":"Dash app to query/filter one table and select rows in Neuroglancer.","diagram":"table-viewer","ng":{}},
  {"id":"tables","term":"Tables","category":"tables","def":"CAVE annotation tables (synapses, nuclei, cell types, proofreading, coregistration).","diagram":"tables","ng":{}},
  {"id":"tags-shortcuts","term":"Tags / Shortcuts","category":"tools","def":"Keyboard-driven annotation labels for fast bulk labeling in Neuroglancer.","diagram":"tags-shortcuts","ng":{}},
  {"id":"target","term":"Target","category":"tables","def":"Disambiguation: <code>target_id</code> (reference link) vs synaptic postsynaptic partner vs path <code>target_index</code>.","flags":["ambiguous"],"ng":{}},
  {"id":"target-postsynaptic","term":"Target (postsynaptic)","category":"connectivity","def":"The postsynaptic partner of a synapse (<code>post_pt_root_id</code>).","diagram":"target-postsynaptic","ng":{}},
  {"id":"teasar","term":"TEASAR","category":"morphology","def":"Algorithm that turns the L2 graph into a skeleton tree.","ng":{}},
  {"id":"tem","term":"TEM","category":"imaging","def":"Transmission EM; MICrONS/V1DD are serial-section TEM-style (thin sections, anisotropic z).","flags":["context"],"ng":{}},
  {"id":"token-auth","term":"Token / auth","category":"cave","def":"Google-account credential required before any programmatic access, saved per server.","diagram":"token-auth","ng":{}},
  {"id":"types-of-errors-in-imagery","term":"Types of errors in imagery","category":"imaging","def":"Section/alignment artifacts (folds, cracks, missing sections) that propagate into segmentation.","diagram":"types-of-errors-in-imagery","ng":{}},
  {"id":"ultrastructure","term":"Ultrastructure","category":"imaging","def":"Fine sub-cellular EM features: organelles, mitochondria, synapses, myelin.","diagram":"ultrastructure","ng":{}},
  {"id":"unit","term":"Unit","category":"dataorg","discipline":"both","flags":["ambiguous"],"def":"A putative neuron in extracellular electrophysiology, with varying degrees of confidence assigned to it. In extracellular electrophysiology, neurons are referred to as <i>units</i>, because we cannot guarantee that all the spikes assigned to one unit actually originate from a single cell. Unlike in two-photon imaging, where you can visualize each neuron throughout the entire experiment, with electrophysiology we can only “see” a neuron when it fires a spike. If a neuron moves relative to the probe, or if it’s far away from the probe, some of its spikes may get mixed together with those from other neurons. Because of this inherent ambiguity, quality metrics allow you to find the right units for your analysis. Even highly contaminated units can contain potentially valuable information about brain states, but certain types of analysis require more stringent quality thresholds to ensure that all of the included units are well isolated from their neighbors.","senses":[
    {"sense":"A putative neuron in extracellular ephys. Spikes are assigned to it with varying confidence, which is why quality metrics exist","where":"<code>units</code> table, <code>unit_id</code>"},
    {"sense":"A functionally imaged cell, identified within a scan and session","where":"MICrONS / V1DD <code>unit_id</code>"}],
   "source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"unit","ng":{}},
  {"id":"unproofread","term":"Unproofread","category":"proofreading","def":"An arbor that has not been comprehensively corrected. It is truncated by split errors and may carry merged fragments of other cells, so its apparent partners are unreliable.","diagram":"unproofread","ng":{}},
  {"id": "somatostatin-sst-cell", "term": "Somatostatin (SST) cell", "category": "celltypes", "def": "A type of inhibitory interneuron expressing the molecular marker somatostatin (SST, or sometimes SOM). SST cells tend to target the distal dendrites of excitatory neurons, and have important roles in regulating the activity of excitatory neurons.", "ng": {}, "source": {"label": "databook glossary", "url": "https://allenswdb.github.io/glossary.html"}, "discipline": "both"},
  {"id": "vip-cell", "term": "VIP cell", "category": "celltypes", "def": "A type of inhibitory interneuron expressing the molecular marker Vasoactive Intestinal Protein. VIP cells tend to target Somatostatin cells rather than excitatory neurons. This role as a \"disinhibitory specialist\" is thought to be important for context-dependent modulation of cortical activity. Many VIP cells have a characteristic bipolar axon that points along the axis of the cortical column and are thus often called \"bipolar cells\".", "ng": {}, "source": {"label": "databook glossary", "url": "https://allenswdb.github.io/glossary.html"}, "discipline": "both"},
  {"id":"v1dd-v1-deep-dive","term":"V1DD (V1 Deep-Dive)","category":"datasets","def":"Functional (2p/3p calcium) + EM dataset of V1 across all layers in 4 mice (~50k neurons/mouse).","datasets":["v1dd"],"diagram":"v1dd-v1-deep-dive","ng":{}},
  {"id":"v1dd-functional-index","term":"V1DD functional index","category":"functional","def":"V1DD's Golden-Mouse <code>column/volume/plane/roi</code> scheme, distinct from MICrONS session/scan/unit.","datasets":["v1dd"],"ng":{}},
  {"id":"vertex-vertices","term":"Vertex / Vertices","category":"morphology","def":"Points in 3D (N×3, nanometers) that, connected, build meshes and skeletons.","diagram":"vertex-vertices","ng":{}},
  {"id":"visp-visal-visrl","term":"VISp / VISal / VISrl","category":"celltypes","def":"The visual cortical areas (V1 / AL / RL / LM) the volume spans and assigns.","diagram":"visp-visal-visrl","ng":{}},
  {"id":"volume","term":"Volume","category":"volume","def":"A cubic-mm 3D EM image dataset spanning a cortical region.","diagram":"volume","ng":{}},
  {"id":"vortex","term":"VORTEX","category":"proofreading","def":"NIH program (Virtual Observatory of the Cortex) funding continued proofreading; source of the <code>vortex_*</code> tables.","ng":{}},
  {"id":"voxel","term":"Voxel","category":"volume","def":"The smallest 3D image unit; anisotropic 4×4×40 nm (MICrONS) / 9×9×45 nm (V1DD).","diagram":"voxel","ng":{}},
  {"id":"watertight","term":"Watertight","category":"morphology","def":"EM meshes are NOT watertight, so Trimesh <code>.volume</code>/<code>.center_mass</code> are invalid.","diagram":"watertight","ng":{}},


  /* from the MICrONS tutorial */
  {"id": "dendritic-spine", "term": "Dendritic spine", "category": "morphology", "discipline": "both", "def": "The small protrusion on a dendrite that receives most excitatory input, with a bulbous head on a thin neck. Spine density separates excitatory from inhibitory dendrites, and spine heads are among the fragments most often left disconnected by automated segmentation.", "ng": {}},
  {"id": "astrocyte", "term": "Astrocyte", "category": "celltypes", "discipline": "both", "def": "A glial cell whose fine processes tile the neuropil and wrap capillaries with endfeet, supporting synapses metabolically and regulating the extracellular environment. Its arbor is a dense thicket rather than a branching tree, which is why it is proofread to a different standard from a neuron.", "ng": {}},
  {"id": "microglia", "term": "Microglia", "category": "celltypes", "discipline": "both", "def": "The resident immune cell of the brain. It surveys the neuropil with motile processes and contacts, prunes and engulfs synapses, so it appears in EM wrapped around structures it is in the act of removing.", "ng": {}},
  {"id": "chandelier-cell", "term": "Chandelier cell (ChC)", "category": "celltypes", "discipline": "both", "def": "A parvalbumin interneuron that synapses exclusively onto the axon initial segments of pyramidal cells, placing it in unique control of whether they fire. Its output forms vertical strings of boutons — the cartridges the cell is named for.", "ng": {}},
  {"id": "neuromodulatory-axon", "term": "Neuromodulatory axon", "category": "celltypes", "discipline": "both", "def": "A long-range axon carrying a neuromodulator rather than a fast transmitter. In EM it is recognised by boutons packed with large dense-core vesicles and by branching that ignores laminar boundaries, since it acts over a volume rather than at a single partner.", "ng": {}},
  {"id": "met-type", "term": "MET-type", "category": "celltypes", "discipline": "both", "def": "A cell type defined jointly by morphology, electrophysiology and transcriptomics, from patch-seq recordings where all three are measured in the same cell. It is a stricter claim than a type named from any one of them alone.", "ng": {}},
  {"id": "cover-paths", "term": "Cover paths", "category": "morphology", "def": "A decomposition of a skeleton into non-overlapping paths, each running from an end point toward the root until it meets a vertex already covered. Every vertex belongs to exactly one, which makes them the right primitive for plotting or walking a neuron.", "source": {"label": "MICrONS tutorial", "url": "https://alleninstitute.github.io/microns_tutorial/"}, "ng": {}},
  {"id": "distance-to-root", "term": "distance_to_root", "category": "morphology", "def": "Path length along the skeleton from a vertex back to the root, in nanometres. Many level-2 vertices collapse onto the single soma vertex, so the value flattens to zero across the cell body rather than varying smoothly.", "source": {"label": "MICrONS tutorial", "url": "https://alleninstitute.github.io/microns_tutorial/"}, "ng": {}},
  {"id": "radial-distance", "term": "Radial distance", "category": "morphology", "def": "Depth measured along the local pia-to-white-matter streamline rather than along a straight line. Cortex curves, so two cells the same Euclidean distance apart can sit in different layers; following the streamline is what makes depth comparable across a volume. <code>standard_transform.radial_distance</code> computes it.", "ng": {}},
  {"id": "geodesic-distance", "term": "Geodesic distance", "category": "morphology", "def": "Distance between two points measured along the neuron itself — path length through the skeleton — rather than through the space between them. Two points a micrometre apart in the volume can be hundreds of micrometres apart on the arbor, and the second number is the one a signal has to travel.", "ng": {}},
  {"id": "link-edges", "term": "Link edges", "category": "morphology", "def": "Extra mesh edges inserted from the proofreading record to bridge gaps where segmentation was merged across a discontinuity. Without them a mesh may be several disconnected pieces; <code>mesh.add_link_edges()</code> heals it, and <code>mesh.graph_edges</code> is the edges plus the link edges.", "source": {"label": "MICrONS tutorial", "url": "https://alleninstitute.github.io/microns_tutorial/"}, "ng": {}},
  {"id": "meshwork-annotation-tables", "term": "Meshwork annotation tables", "category": "morphology", "def": "The dataframes carried on <code>nrn.anno</code>, indexed to mesh and skeleton vertices: <code>pre_syn</code>, <code>post_syn</code>, <code>is_axon</code>, <code>lvl2_ids</code>, <code>segment_properties</code>, <code>vol_prop</code>. They are what places a synapse at a position along the arbor rather than merely in the volume.", "source": {"label": "MICrONS tutorial", "url": "https://alleninstitute.github.io/microns_tutorial/"}, "ng": {}},
  {"id": "meshwork-mask", "term": "Meshwork mask", "category": "morphology", "def": "A boolean array over mesh vertices restricting a meshwork to part of a cell, applied with <code>apply_mask</code> or <code>mask_context</code> so mesh, skeleton and annotations stay in step. Masking on <code>anno.is_axon</code> is how axonal and dendritic path length are measured separately.", "flags": ["ambiguous"], "source": {"label": "MICrONS tutorial", "url": "https://alleninstitute.github.io/microns_tutorial/"}, "ng": {}},
  {"id": "pcg-skel", "term": "pcg_skel", "category": "morphology", "def": "Builds a skeleton for a root id directly from the level-2 chunked graph, optionally attaching synapses and volumetric properties. Because it never touches the full-resolution mesh it can skeletonise very large neurons quickly.", "source": {"label": "MICrONS tutorial", "url": "https://alleninstitute.github.io/microns_tutorial/"}, "ng": {}},
  {"id": "neurd", "term": "NEURD", "category": "morphology", "def": "Decomposes a neuron mesh into an annotated graph of processes, spines and boutons, supporting automated proofreading and feature extraction. The Baylor cell-type tables are derived from it.", "source": {"label": "MICrONS tutorial", "url": "https://alleninstitute.github.io/microns_tutorial/"}, "ng": {}},
  {"id": "spectral-shape-analysis", "term": "Spectral shape analysis (HKS)", "category": "morphology", "def": "Shape descriptors computed from the heat kernel on a mesh, invariant to how the surface is bent. A classifier on these features drives the spine, shaft and soma predictions attached to synapses.", "source": {"label": "MICrONS tutorial", "url": "https://alleninstitute.github.io/microns_tutorial/"}, "ng": {}},
  {"id": "multifeature-cell-types", "term": "Multifeature cell types", "category": "celltypes", "def": "A labelling scheme combining somatic, dendritic and spine features. Excitatory labels are layer plus projection class (<code>L2IT</code>…<code>L6CT</code>); inhibitory labels split more finely than the mtypes (<code>NMC</code>, <code>ChC</code>, <code>PV</code>, <code>AltBasket</code>, <code>AltDTC</code>, <code>ITCperi</code>, <code>L1</code>).", "datasets": ["microns"], "source": {"label": "MICrONS tutorial", "url": "https://alleninstitute.github.io/microns_tutorial/"}, "ng": {}},
  {"id": "non-neuronal-cell-types", "term": "Non-neuronal cell types", "category": "celltypes", "def": "The glial and vascular labels the cell-type tables use: <code>astrocyte</code>, <code>microglia</code>, <code>oligo</code>, <code>OPC</code> and <code>pericyte</code>, carried under a <code>classification_system</code> of <code>aibs_coarse_nonneuronal</code> or <code>nonneuron</code>.", "datasets": ["microns"], "source": {"label": "MICrONS tutorial", "url": "https://alleninstitute.github.io/microns_tutorial/"}, "ng": {}},
  /* ── physiology ─────────────────────────────────────────────────────
     Entries marked with a databook-glossary source are adopted from
     https://allenswdb.github.io/glossary.html rather than rewritten. Edit
     those only to fix an error, and keep the source link.               */

  /* recording modalities & instruments */
  {"id":"electrophysiology","term":"Extracellular electrophysiology","category":"modalities","def":"Recording voltage from outside the cell membrane, which gives better access to intact brains than intracellular recording. Its two readouts are spikes and the local field potential.","source":{"label":"databook","url":"https://allenswdb.github.io/background/Neuropixels-electrophysiology.html"},"diagram":"electrophysiology","ng":{}},
  {"id":"ephys","term":"Ephys","category":"modalities","def":"Shorthand for electrophysiology.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"ophys","term":"Ophys","category":"modalities","def":"Shorthand for optical physiology, often in reference to Two-photon calcium imaging, but can also include other methods such as fiber photometry.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"two-photon-calcium-imaging","term":"Two-photon calcium imaging","category":"modalities","def":"A term for techniques which measure neural activity of neurons by measuring a fluorescent calcium indicator. These indicators are usually a protein expressed in a cell, such as GCaMP, often using a specific combination of Driver line and reporter lines to express GCaMP in a specific subset of neurons. Fluorescent dyes can also be used to perform calcium imaging. At rest a neuron has low levels of calcium, and when the neuron spikes calcium flows into the neuron and raises the level of calcium, which binds to the calcium indicator and increases the emitted fluorescence in a specific wavelength. See {cite:t}`svoboda2006` for a review of two-photon calcium imaging.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"two-photon-calcium-imaging","ng":{}},
  {"id":"two-photon-excitation","term":"Two-photon excitation","category":"modalities","def":"Two long-wavelength photons excite one fluorophore. Absorption is non-linear in photon density, so only a single voxel is excited at a time — that is what gives optical sectioning in intact tissue.","source":{"label":"databook","url":"https://allenswdb.github.io/background/Two-photon-calcium-imaging.html"},"diagram":"two-photon-excitation","ng":{}},
  {"id":"three-photon-imaging","term":"Three-photon (3P) imaging","category":"modalities","def":"Raises signal-to-noise for deep imaging of densely labelled tissue. Used to extend the V1DD centre column to white matter, where 2P image quality has degraded.","ng":{}},
  {"id":"neuropixels","term":"Neuropixels","category":"modalities","def":"A family of devices for obtaining high channel count single unit extracellular recordings created through a collaborative open science project funded by Howard Hughes Medical Institute, Gatsby Charitable Trust, the Wellcome Trust, and the Allen Institute. These devices utilize modern integrated circuit design to miniaturize aspects of electrophysiology, enabling recordings of hundred of single units from a single probe with minimal brain damage. {cite:t}`jun2017` describes these probes; a summary can also be found here.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"neuropixels","ng":{}},
  {"id":"spike-band-lfp-band","term":"Spike band / LFP band","category":"modalities","def":"The two streams split off each channel: the spike band at 30 kHz with a 500 Hz high-pass, carrying action potentials from adjacent neurons; the LFP band at 2.5 kHz, carrying low-frequency fluctuations from a wider area.","source":{"label":"databook","url":"https://allenswdb.github.io/background/neuropixels-description.html"},"diagram":"spike-band-lfp-band","ng":{}},
  {"id":"probe-shank-channel","term":"Probe / shank / channel / site","category":"modalities","def":"The recording hierarchy: a probe carries one or more shanks, a shank is patterned with recording sites, and the subset wired out for recording at any moment are the channels.","diagram":"probe-shank-channel","ng":{}},
  {"id":"imaging-plane","term":"Imaging plane","category":"modalities","def":"One two-photon focal plane. A single-plane microscope images one per session; the Multiscope/Mesoscope images up to eight. The plane, not the session, is the unit that quality control passes or fails.","diagram":"imaging-plane","ng":{}},
  {"id":"imaging-depth","term":"Imaging depth","category":"modalities","def":"Depth in µm below the cortical surface at which a plane was collected. Roughly: &lt;250 layer 2/3, 250–350 layer 4, 350–500 layer 5, &gt;500 layer 6 — but layer-specific Cre lines are the reliable way to get layer specificity.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/ophys/visual-coding/vc2p-dataset.html"},"diagram":"imaging-depth","ng":{}},
  {"id":"field-of-view","term":"Field of view","category":"modalities","def":"The imaged extent of one plane, in pixels and in µm. Recorded per imaging plane as <code>field_of_view_width/height</code>.","flags":["ambiguous"],"ng":{}},
  {"id":"head-fixation","term":"Head fixation / head bar","category":"modalities","def":"A surgically implanted bar clamps the mouse's head in a repeatable position — better than 10 µm across clamp cycles, which is what makes it possible to return to the same cells on a later day.","source":{"label":"databook","url":"https://allenswdb.github.io/background/experimental-setup.html"},"diagram":"head-fixation","ng":{}},
  {"id":"intrinsic-signal-imaging","term":"Intrinsic signal imaging (ISI)","category":"modalities","def":"Intrinsic signal imaging, also called ISI, is a method to measure changes in blood flow associated with neural activity using reflectance of red light on the brain's surface, measured using a standard CCD camera. The amount of red light reflected by the brain tissue increases when oxygenated hemoglobin perfuses the local region. The timecourse of the ISI signal is slow, and the magnitude of the reflectance changes are small. As a result, the use of periodic stimuli can aid in signal detection. A common use of ISI is to map retinotopy across the brain surface by moving a slowly drifting bar across the visual field then measuring the signal in each pixel at the frequency of the periodic drifting bar. ISI has also been used to identify orientation maps in species with organized orientation maps like cats and primates, as well as to map the location of the whisker barrels in somatosensory cortex of the mouse. For additional papers using ISI to map the organization of the mouse visual cortex see {cite:t}`kalatsky2003` and {cite:t}`garrett2014`.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"flags":["ambiguous"],"ng":{}},

  /* signals & preprocessing */
  {"id":"spike-sorting","term":"Spike sorting","category":"signals","def":"Assigning detected spikes to individual neurons — a blind source separation problem. Detection, extraction, feature extraction, clustering, then validation against the refractory period.","source":{"label":"databook","url":"https://allenswdb.github.io/background/Neuropixels-electrophysiology.html"},"diagram":"spike-sorting","ng":{}},
  {"id":"single-vs-multi-unit","term":"Single unit vs multi-unit","category":"signals","def":"Not two categories but a gradient, from complete and uncontaminated to incomplete and highly contaminated. Every analysis still has to draw a binary line somewhere; quality metrics are how you draw it deliberately.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/ephys/visual-coding/vcnp-quality-metrics.html"},"ng":{}},
  {"id":"waveform","term":"Waveform","category":"signals","def":"In a system neuroscience setting, this often refers to the voltage over time measured with an electrode when an individual neuron produces an action potential.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"waveform","ng":{}},
  {"id":"peak-channel","term":"Peak channel","category":"signals","def":"The channel on which a unit's mean waveform is largest. A unit carries no position of its own — joining <code>peak_channel_id</code> to the electrodes table at <code>general/extracellular_ephys/electrodes</code> is how it acquires a CCF location, a brain-region label and a depth.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/ephys/visual-coding/vcnp-units.html"},"diagram":"peak-channel","ng":{}},
  {"id":"local-field-potential","term":"Local field potential (LFP)","category":"signals","def":"Transient electrical potential generated in nervous tissue by the summed activity of cells in that tissue. This is typically measured in a lower temporal-frequency band of less than 250 Hz.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"local-field-potential","ng":{}},
  {"id":"current-source-density","term":"Current source density (CSD)","category":"signals","def":"The second spatial derivative of the LFP along the probe, which localises current sinks and sources and so the laminar position of synaptic input.","diagram":"current-source-density","ng":{}},
  {"id":"roi-mask","term":"ROI mask","category":"signals","def":"A <b>region of interest</b> is a general term that describes a subregion of an image. When used in reference to two photon calcium imaging, an ROI is the mask containing pixels thought to belong to a single neuron.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"roi-mask","ng":{}},
  {"id":"neuropil-correction","term":"Neuropil correction","category":"signals","def":"An annulus around the ROI, excluding nearby cells, gives a local neuropil signal. It is subtracted from the raw trace after weighting by a per-cell <code>r</code> value.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/ophys/visual-coding/vc2p-session-data.html"},"diagram":"neuropil-correction","ng":{}},
  {"id":"df-f","term":"ΔF/F (dF/F)","category":"signals","def":"Change in fluorescence normalised by a baseline. The baseline is the median fluorescence in a 180 s window centred on each time point, so ΔF/F is a relative, unitless signal.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/ophys/visual-coding/vc2p-session-data.html"},"diagram":"df-f","ng":{}},
  {"id":"event-detection","term":"Event detection","category":"signals","def":"The <code>events</code> array that sits beside <code>dff</code>: ΔF/F deconvolved into discrete events, one value per frame per ROI. Small events are recovered unreliably, so it is a cleaner signal than ΔF/F but not a spike train.","source":{"label":"databook","url":"https://allenswdb.github.io/background/Two-photon-calcium-imaging.html"},"diagram":"event-detection","ng":{}},
  {"id":"maximum-projection","term":"Maximum / average projection","category":"signals","def":"The imaging movie collapsed over time into one image — the standard way to see every cell in a plane at once.","flags":["ambiguous"],"ng":{}},
  {"id":"running-speed","term":"Running speed","category":"signals","def":"Speed on the running disc, temporally aligned to the activity traces. Same length as ΔF/F, so a stimulus epoch indexes into both.","diagram":"running-speed","ng":{}},

  /* quality metrics */
  {"id":"quality-metrics","term":"Unit quality metrics","category":"quality","def":"Per-unit numbers describing how badly spike sorting may have gone wrong for that unit — contamination from other neurons, spikes missed, or the unit drifting away. None is perfect; which thresholds apply depends on the analysis.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/ephys/visual-coding/vcnp-quality-metrics.html"},"diagram":"quality-metrics","ng":{}},
  {"id":"firing-rate","term":"firing_rate","category":"quality","def":"Mean spike rate over the whole session. Low values may mean a sparsely active neuron or a badly detected one.","ng":{}},
  {"id":"presence-ratio","term":"presence_ratio","category":"quality","def":"Fraction of the session in which the unit had spikes. A low value usually means the unit drifted away from the probe. Default threshold 0.9.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/ephys/visual-coding/vcnp-quality-metrics.html"},"diagram":"presence-ratio","ng":{}},
  {"id":"amplitude-cutoff","term":"amplitude_cutoff","category":"quality","def":"Estimated fraction of the unit's spikes that fell below the detection threshold and were never recorded — a false-negative rate. Default threshold 0.1.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/ephys/visual-coding/vcnp-quality-metrics.html"},"diagram":"amplitude-cutoff","ng":{}},
  {"id":"isi-violations","term":"isi_violations","category":"quality","def":"Rate of inter-spike intervals shorter than the refractory period. A real neuron cannot fire that fast, so violations mean spikes from more than one cell were merged. Default threshold 0.5.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/ephys/visual-coding/vcnp-quality-metrics.html"},"diagram":"isi-violations","ng":{}},
  {"id":"snr-unit","term":"snr","category":"quality","def":"Waveform amplitude relative to background noise on the peak channel.","flags":["ambiguous"],"ng":{}},
  {"id":"isolation-distance","term":"isolation_distance","category":"quality","def":"Distance in Mahalanobis space to the nearest other cluster of waveforms. Higher is better separated.","ng":{}},
  {"id":"d-prime-unit","term":"d_prime (unit)","category":"quality","def":"Separability of this unit's waveforms from its neighbours', by linear discriminant analysis. Higher is better. Not the behavioural d-prime.","flags":["ambiguous"],"ng":{}},
  {"id":"l-ratio","term":"l_ratio","category":"quality","def":"Contamination measure related to isolation distance: the probability that nearby spikes belong to this cluster. Lower is better.","ng":{}},
  {"id":"nn-hit-miss","term":"nn_hit_rate / nn_miss_rate","category":"quality","def":"Nearest-neighbour estimates of contamination and of missing spikes respectively.","ng":{}},
  {"id":"drift-metrics","term":"Drift metrics","category":"quality","def":"<code>max_drift</code> and <code>cumulative_drift</code> record how far, in µm, a unit's spikes moved along the probe during the session. Newer pipelines add <code>activity_drift</code> and <code>drift_ptp</code>.","flags":["ambiguous"],"diagram":"drift-metrics","ng":{}},
  {"id":"default-qc","term":"default_qc","category":"quality","def":"A single pass/fail flag summarising the pipeline's quality criteria for a unit, in the AIND-packaged datasets.","ng":{}},
  {"id":"decoder-label","term":"decoder_label","category":"quality","def":"The pipeline's automated call on what a unit is — <code>sua</code> for a single unit, and so on — with <code>decoder_probability</code> as its confidence.","ng":{}},
  {"id":"valid-roi","term":"valid_roi","category":"quality","def":"The ophys equivalent of a unit quality flag: whether cell classification judged a segmented ROI to be a real cell. Only valid ROIs are released.","ng":{}},
  {"id":"default-filters","term":"Default quality filtering","category":"quality","def":"Visual Coding applies <code>isi_violations</code>, <code>amplitude_cutoff</code> and <code>presence_ratio</code> filters by default; Visual Behavior Neuropixels returns every unit unfiltered. Opposite defaults on the same kind of data — check which you are holding.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/ephys/visual-coding/vcnp-quality-metrics.html"},"ng":{}},

  /* genetic & optical tools */
  {"id":"cre-line","term":"Cre line","category":"genetics","def":"The Cre-lox system is a site-specific recombinase technology. Cre-recombinase is a tyrosine site-specific recombinase that catalyzes the recombination of DNA between specific sites known as <b>loxP</b> sequences. As used in these experiments, Cre is used with loxP Reporter line in order to drive recombinase of the loxP sites and drive the expression of the reporter. As Cre is often expressed within a specific gene, this allows the reporter expression to be restricted to particular subset of cells. For specific lines used, see the section on transgenic tools.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"cre-line","ng":{}},
  {"id":"driver-line","term":"Driver line","category":"genetics","def":"A general term for transgenic mouse lines that are engineered to label a specific cell type or cell population by expressing a specific gene under the control of the promoter for the cell type or cell population of interest. A Cre line is a common type of Driver line that allows specific genes to be expressed when crossed with a reporter line. The driver line determines what cell population is targeted, and the reporter line determines what will be expressed in that specific cell population (for example, GFP, GCaMP, or Channelrhodopsin).","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"reporter-line","term":"Reporter line","category":"genetics","def":"A <b>reporter line</b> is a transgenic mouse line that is engineered to express a specific protein that enables monitoring or manipulation of neural activity (such as GFP, GCaMP, or Channelrhodopsin) under the control of cre or FLP recombinase, or a tetracycline transactivator system. The gene engineered into the reporter line will not be expressed unless the protein that controls reporter gene expression (such as cre or FLP) is present, such as by breeding a mouse from the reporter line with a mouse from a specific Driver line that expresses the control protein. Injecting a virus that delivers cre or FLP in a cell type specific manner can also trigger the expression of the reporter gene.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"transgenic-line","term":"Transgenic line","category":"genetics","def":"A mouse line whose genome has been altered by the introduction of one or more foreign DNA sequences. For these contexts, this typical involves using Cre lines to drive the expression of a Reporter line within a specific subset of cells.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"geci","term":"Genetically-encoded calcium indicator (GECI)","category":"genetics","def":"A protein expressed by a cell that will change its fluorescence upon binding to a Ca{sup}`2+` ion. Used to visualize neural activity with fluorescence microscopy.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"geci","ng":{}},
  {"id":"gcamp","term":"GCaMP","category":"genetics","def":"A family of GECI. GCaMP was generated by a fusion of the calcium binding domain of the calmodulin protein with green fluorescent protein (GFP). In these data we use primarily GCaMP6f as well as some GCaMP6s, fast and slow variants respectively. These two variants differ in their sensitivity as well as their kinetics — primarily with regards to their decay. For more see {cite:t}`chen2013`.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"fluorophore","term":"Fluorophore","category":"genetics","def":"A type of molecule which absorb light and re-emit it at a longer wavelength in a process called fluorescence. As a result, fluorophores fluoresce only while exposed to a light source.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"opsin","term":"Opsin","category":"genetics","def":"A light-gated ion channel. Illumination changes its conformation, letting ions cross the membrane and either forcing the cell to spike (excitatory opsin) or suppressing spiking (inhibitory).","source":{"label":"databook","url":"https://allenswdb.github.io/background/Optotagging.html"},"diagram":"opsin","ng":{}},
  {"id":"channelrhodopsin","term":"Channelrhodopsin (ChR2)","category":"genetics","def":"A light-gated ion channel used in the field of optogenetics to control neuronal activity with light.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"chrmine","term":"ChRmine","category":"genetics","def":"A red-shifted opsin, excited near 1080 nm. Because GCaMP is excited near 920 nm the two can be driven independently, which is what makes simultaneous imaging and single-cell photostimulation possible.","ng":{}},
  {"id":"optogenetics","term":"Optogenetics","category":"genetics","def":"A method for controlling the activity of neurons by expressing light activated ion channels (using a reporter line ) in a specific subpopulation of cells (using a Driver line) to enable temporally precise control of neural spiking. Spiking can be suppressed or enhanced using different types of reporters. See {cite:t}`peron2011` for a review on optogenetics as a method.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"optotagging","term":"Optotagging","category":"genetics","def":"A technique that uses optogenetics in order to identify neurons that belong to a specific subpopulation. See: Optotagging.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"optotagging","ng":{}},
  {"id":"direct-vs-indirect","term":"Direct vs indirect activation","category":"genetics","def":"The central pitfall of optotagging: a neuron may respond to the laser because it expresses the opsin, or because a neuron that does synapses onto it. Direct responses are short-latency (&lt;10 ms), reliable across pulses, and tightly distributed in time.","source":{"label":"databook","url":"https://allenswdb.github.io/background/Optotagging.html"},"diagram":"direct-vs-indirect","ng":{}},
  {"id":"enhancer-aav","term":"Enhancer AAV","category":"genetics","def":"A virus carrying a cell-type-specific enhancer, used to restrict expression without breeding a transgenic line.","ng":{}},

  /* stimuli & behavioural tasks */
  {"id":"drifting-gratings","term":"Drifting gratings","category":"stimuli","def":"A full-field sinusoidal grating moving orthogonal to its own orientation. Parameters: orientation and direction (degrees), temporal frequency (Hz), spatial frequency (cycles/deg), contrast. Typically 2 s on, 1 s grey.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/stimuli/passive-visual-stimuli/visual-stimuli-list.html"},"diagram":"drifting-gratings","ng":{}},
  {"id":"static-gratings","term":"Static gratings","category":"stimuli","def":"A stationary full-field sinusoidal grating flashed for 0.25 s. No temporal frequency; phase becomes a parameter instead.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/stimuli/passive-visual-stimuli/visual-stimuli-list.html"},"diagram":"static-gratings","ng":{}},
  {"id":"gabor-patches","term":"Gabor patches","category":"stimuli","def":"Spatially restricted gratings. The receptive-field mapping stimulus in Visual Coding Neuropixels: 20° diameter, three orientations on a 9 × 9 grid of screen positions, identical in every session.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/ephys/visual-coding/vcnp-receptive-fields.html"},"diagram":"gabor-patches","ng":{}},
  {"id":"locally-sparse-noise","term":"Locally sparse noise","category":"stimuli","def":"Black and white spots flashed on a grey screen, arranged so no two spots fall within 5 pixels of each other. The exclusion zone is what makes the average around any pixel structureless, so a receptive field can be recovered.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/stimuli/passive-visual-stimuli/visual-stimuli-list.html"},"diagram":"locally-sparse-noise","ng":{}},
  {"id":"natural-scenes","term":"Natural scenes","category":"stimuli","def":"Black and white photographs with natural spatial statistics, flashed for 0.25 s with no gap. Visual Coding uses 118 images drawn from the Berkeley, van Hateren and McGill image sets.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/stimuli/passive-visual-stimuli/visual-stimuli-list.html"},"ng":{}},
  {"id":"natural-movies","term":"Natural movies","category":"stimuli","def":"Black and white film clips with natural spatial and temporal statistics — usually the opening shot of <i>Touch of Evil</i>, chosen because it is continuous, with no cuts and varied motion.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/stimuli/passive-visual-stimuli/visual-stimuli-list.html"},"ng":{}},
  {"id":"blank-sweep","term":"Blank sweep","category":"stimuli","def":"A trial in which the stimulus is replaced by mean-luminance grey, interleaved among real trials so each stimulus has its own baseline.","diagram":"blank-sweep","ng":{}},
  {"id":"spontaneous-activity","term":"Spontaneous activity","category":"stimuli","def":"An epoch of mean-luminance grey with no patterned stimulus, included in most sessions as a baseline for visually evoked activity.","ng":{}},
  {"id":"stimulus-template","term":"Stimulus template","category":"stimuli","def":"The literal image shown, stored alongside the stimulus table for image and movie stimuli. Often available both <code>unwarped</code> and <code>warped</code> — the warped version is what the monitor rendered.","ng":{}},
  {"id":"change-detection","term":"Change detection task","category":"stimuli","def":"A go/no-go task: images are presented in a continuous stream and the mouse earns water by licking when the image identity changes. The 500 ms grey gap between images adds a working-memory component.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/stimuli/visual-behavior/VB-Behavior.html"},"diagram":"change-detection","ng":{}},
  {"id":"trial-outcomes","term":"Hit / miss / false alarm / correct reject","category":"stimuli","def":"Lick within the 750 ms window after a change = hit; no lick after a change = miss; lick after a sham change = false alarm; withholding on a sham change = correct reject. Licking before the scheduled change aborts the trial.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/stimuli/visual-behavior/VB-Behavior.html"},"diagram":"trial-outcomes","ng":{}},
  {"id":"catch-trial","term":"Catch trial / sham change","category":"stimuli","def":"A change time is drawn but the image does not change. This conservative definition counts only presentations drawn from the change-time distribution; aborted trials are arguably catches too.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/stimuli/visual-behavior/VB-Behavior.html"},"ng":{}},
  {"id":"omission","term":"Omission","category":"stimuli","def":"5% of non-change presentations are dropped, interrupting the expected stimulus cadence so that expectation signals can be measured. Omissions occur during recording but not during training, and never at or just before a change.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/stimuli/visual-behavior/VB-Behavior.html"},"diagram":"omission","ng":{}},
  {"id":"image-set","term":"Image set","category":"stimuli","def":"Which eight natural images a session used (G or H, A or B). Two images are shared between sets, so novelty is a property of the other six.","ng":{}},
  {"id":"experience-level","term":"Experience level","category":"stimuli","def":"Whether the image set in a session is the one the mouse trained on (<code>Familiar</code>) or a different one (<code>Novel</code>). The axis the Visual Behavior datasets were built to test.","ng":{}},
  {"id":"passive-replay","term":"Passive replay block","category":"stimuli","def":"The same stimuli replayed with the lick spout retracted and no reward, so task-dependent modulation can be separated from stimulus drive.","ng":{}},
  {"id":"d-prime-behavior","term":"d-prime (behavioural)","category":"stimuli","def":"Signal-detection sensitivity for the task: how far the hit rate exceeds the false-alarm rate. Not the unit quality metric of the same name.","flags":["ambiguous"],"ng":{}},
  {"id":"dynamic-foraging","term":"Dynamic foraging task","category":"stimuli","def":"Two choices, binary reward, and reward probabilities that change during the session. A go cue opens a short window in which the mouse licks left or right; the mouse must learn from recent outcomes to track the better side.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/stimuli/dynamic-foraging/Dynamic-Foraging.html"},"diagram":"dynamic-foraging","ng":{}},
  {"id":"baiting","term":"Baiting / coupled vs uncoupled","category":"stimuli","def":"Baiting: a reward an unchosen side would have given is held and delivered on the next choice of that side. Coupled or uncoupled describes whether the two sides' probabilities change together or independently.","ng":{}},
  {"id":"q-value-rpe","term":"Q value / RPE","category":"stimuli","def":"Latent variables of a reinforcement-learning fit to foraging behaviour: the expected value of each choice, and the reward prediction error that updates it. Useful precisely because they can then be regressed against neural activity.","diagram":"q-value-rpe","ng":{}},
  {"id":"dynamic-routing","term":"Dynamic Routing task","category":"stimuli","def":"A context-dependent go/no-go task alternating visual and auditory blocks. The same stimulus is a target or not depending on the current block, so stimulus and meaning can be separated.","diagram":"dynamic-routing","ng":{}},
  {"id":"context-block","term":"Context block","category":"stimuli","def":"A ten-minute stretch in which only one modality is rewarded, signalled by instruction trials at its start. Blocks alternate for six blocks in a session.","flags":["ambiguous"],"ng":{}},
  {"id":"rmi","term":"Response modulation index (RMI)","category":"stimuli","def":"The normalised contrast between visual and auditory target response rates, collapsing two hit rates into one number that says which context the mouse is behaving in.","ng":{}},
  {"id":"bci-task","term":"BCI task / conditioned neuron","category":"stimuli","def":"A lickport moves toward the mouse at a speed set by the fluorescence of one chosen neuron. Reaching the near position within 10 s earns water. Mice usually learn to drive that neuron within about 30 trials.","source":{"label":"databook","url":"https://allenswdb.github.io/physiology/ophys/BCI/BCI-overview.html"},"diagram":"bci-task","ng":{}},

  /* response properties & analysis */
  {"id":"receptive-field","term":"Receptive field","category":"responses","def":"In a sensory context, the receptive field of a neuron is the region of the stimulus domain in which sensory stimulus needs to lie in order to evoke a response. For visual cortical cells, for example, the receptive field is the region of visual space in which stimuli can evoke neural responses. In a computational context, this notion is often generalized multiple dimensions (e.g. space, time, frequency, etc.) and thus equates to the necessary stimulus features that drive neural response (e.g. a localized grating of a specific orientation and frequency).","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"receptive-field","ng":{}},
  {"id":"retinotopy","term":"Retinotopy","category":"responses","def":"<b>retinotopy</b> refers to the mapping of visual space on to neural space. Most visual areas of the brain contain an orderly map of visual space such that neighboring regions in space are represented by neighboring regions in the brain. Retinotopic maps are typically measured in terms of altitude (aka vertical retinotopy), referring to the axis from upper to lower visual field, and and azimuth (aka horizontal retinotopy), referring to the axis from left to right in space.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"retinotopy","ng":{}},
  {"id":"higher-visual-area","term":"Higher visual area (HVA)","category":"responses","def":"A **higher visual area** is a term for cortical visual areas that receive input from the primary visual cortex, thus considered to be \"higher\" in the visual hierarchy. In primates, higher visual areas include V2, V3, V4, V5, MT, etc. In the mouse, higher visual areas include: VISl, VIsal, VISpm, VISam, VISrl among others. For more, see {cite:t}`glickfeld_higher-order_2017`.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"spatial-frequency","term":"Spatial frequency","category":"responses","def":"How often sinusoidal components of as signal or structure repeat per unit of distance. When used in reference to drifting gratings, spatial frequency means the distance between the bars of the grating. Typically measured as cycles per degree.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"temporal-frequency","term":"Temporal frequency","category":"responses","def":"How many complete periods the signal goes through for a given unit of time. Typically measured in Hertz.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"tuning-curve","term":"Tuning curve","category":"responses","def":"Mean response plotted against a stimulus parameter. The shape of the curve is what selectivity indices such as OSI and DSI summarise in one number.","diagram":"tuning-curve","ng":{}},
  {"id":"psth","term":"PSTH","category":"responses","def":"Peri-stimulus time histogram: spikes binned relative to stimulus onset and averaged over trials, giving the time course of the response.","diagram":"psth","ng":{}},
  {"id":"raster","term":"Spike raster","category":"responses","def":"One row per trial, one tick per spike, aligned on an event. The plot to make before any model, because it shows trial-to-trial structure that an average hides.","diagram":"raster","ng":{}},
  {"id":"evoked-vs-spontaneous","term":"Evoked vs spontaneous","category":"responses","def":"Activity driven by a stimulus versus activity during the grey-screen epochs. The comparison that decides whether a response is a response at all.","ng":{}},
  {"id":"signal-noise-correlation","term":"Signal vs noise correlation","category":"responses","def":"Signal correlation compares two cells' mean responses across stimulus conditions — do they like the same things. Noise correlation compares their trial-to-trial fluctuations to the same condition — do they vary together.","diagram":"signal-noise-correlation","ng":{}},
  {"id":"encoding-vs-decoding","term":"Encoding vs decoding","category":"responses","def":"Encoding asks whether an event changes neural activity; decoding asks whether the event can be read back out of the activity. Same data, opposite direction.","diagram":"encoding-vs-decoding","ng":{}},
  {"id":"surround-suppression","term":"Surround suppression","category":"responses","def":"A stimulus extending beyond a cell's classical receptive field suppresses its response. Stronger in superficial layers, and one of the questions V1DD's windowed and full-field gratings were designed to address.","diagram":"surround-suppression","ng":{}},
  {"id":"selection-bias-ephys","term":"Ephys selection bias","category":"responses","def":"Spike sorting needs enough spikes to form a cluster, so sparsely active neurons are missed and large-spike, high-rate neurons — and layer 5 — are over-represented. Ophys sees many of the cells ephys does not.","source":{"label":"databook","url":"https://allenswdb.github.io/background/Ophys-ephys-comparison.html"},"diagram":"selection-bias-ephys","ng":{}},
  {"id":"indicator-sparsification","term":"Indicator sparsification","category":"responses","def":"Calcium indicators respond non-linearly to firing rate: bursts are boosted, isolated spikes washed out. Tuning measured with ophys therefore looks sharper and sparser than the same tuning measured with ephys.","source":{"label":"databook","url":"https://allenswdb.github.io/background/Ophys-ephys-comparison.html"},"diagram":"indicator-sparsification","ng":{}},

  /* datasets, sessions & files */
  {"id":"nwb","term":"NWB (Neurodata Without Borders)","category":"dataorg","def":"A standardized file format for physiology and behavior data. All of our physiology and behavior data is stored in NWB files. The Visual Coding and Visual Behavior data are in NWB files with a hdf backend, while the newer data (V1DD, BCI, Dynamic Foraging, NP Ultra & Psychedelics) have a Zarr backend - which is optimized for cloud access. More info can be found here","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"nwb","ng":{}},
  {"id":"ophys-experiment","term":"Ophys experiment","category":"dataorg","def":"<b>One imaging plane in one session</b> — the narrowest unit in the hierarchy, with its own <code>imaging_depth</code> and <code>targeted_structure</code>. Quality control passes or fails each plane separately.","flags":["ambiguous"],"diagram":"ophys-experiment","ng":{}},
  {"id":"cell-specimen-id","term":"cell_specimen_id","category":"dataorg","def":"The identifier a cell keeps once it has been matched across sessions, so the same neuron carries it on every day it was imaged. Before matching, a segmented ROI has only a <code>cell_roi_id</code>, unique to one plane on one day — joining on that one instead silently drops the across-day link.","ng":{}},
  {"id":"ccf","term":"Common Coordinate Framework (CCF)","category":"dataorg","def":"The CCF is a a standard 3D reference space for the mouse brain that enables spatial integration of data across modalities.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"ccf","ng":{}},
  {"id":"structure-acronym","term":"Structure acronym","category":"dataorg","def":"The CCF region label attached to a channel or unit — <code>VISp</code>, <code>MOs</code>, <code>LSr</code>. A unit with no CCF registration gets coordinates of <code>[-1, -1, -1]</code>.","ng":{}},
  {"id":"aind-metadata","term":"AIND metadata schema","category":"dataorg","def":"Six JSON classes describing a newer data asset: data description, subject, procedures, rig or instrument, session or acquisition, and processing. Where you look up which virus was injected, or what a capsule actually ran.","source":{"label":"databook","url":"https://allenswdb.github.io/background/metadata.html"},"ng":{}},

  /* multi-sense entries: one word, several incompatible meanings */
  {"id":"experiment","term":"Experiment","category":"dataorg","discipline":"both","flags":["ambiguous"],"def":"<i>There is no consistent use of this term</i> It can refer to a stimulus protocol, an entire data collection campaign, or a single session. It is highly ambiguous.","senses":[
    {"sense":"One imaging plane in one session","where":"Visual Behavior Ophys — <code>ophys_experiment_id</code>"},
    {"sense":"A set of three sessions on the same field of view","where":"Visual Coding 2P — <code>experiment_container</code>"},
    {"sense":"An entire data-collection campaign","where":"colloquial use throughout"}],
   "source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"container","term":"Container","category":"dataorg","discipline":"both","flags":["ambiguous"],"def":"<i>There is no consistent use of this term</i> Most often this refers to the set of recording sessions for a single ophys imaging plane, but can also refer to the set of sessions for an animal.","senses":[
    {"sense":"The set of sessions for one imaging plane","where":"<code>ophys_container_id</code>, <code>experiment_container_id</code>"},
    {"sense":"The set of sessions for one animal","where":"colloquial use"},
    {"sense":"A grouping of derived signals inside an NWB file","where":"<code>nwb.processing['ophys']</code>"},
    {"sense":"The compute environment the code runs in","where":"Code Ocean capsules, Docker"}],
   "source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"epoch","term":"Epoch","category":"dataorg","discipline":"both","flags":["ambiguous"],"def":"A labelled stretch of time — but of what, and on whose clock, differs everywhere it appears.","senses":[
    {"sense":"A block during which one stimulus type was shown","where":"stimulus epoch table; <code>nwb.epochs</code>"},
    {"sense":"The grey-screen period with no patterned stimulus","where":"spontaneous activity epoch"},
    {"sense":"One pass of a training set","where":"machine learning"}],"ng":{}},
  {"id":"state","term":"State","category":"dataorg","discipline":"both","flags":["ambiguous"],"def":"Four unrelated meanings, two of which appear in the same workshop.","senses":[
    {"sense":"What the animal is doing and how engaged it is","where":"behavioural state"},
    {"sense":"A latent variable fitted to behaviour or activity","where":"HMM state"},
    {"sense":"Arousal or neuromodulatory condition of the brain","where":"brain state"},
    {"sense":"A saved JSON view specification","where":"Neuroglancer state"}],"ng":{}},

  {"id":"action-potential","term":"Action potential","category":"celltypes","discipline":"both","def":"A characteristic signal that appears in excitable cell membranes, which takes the form of an electric potential difference waveform that propagates down the length of the cell membrane. In neurons, these indicate neuron activation. See Spike.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"action-potential","ng":{}},
  {"id":"interneuron","term":"Interneuron","category":"celltypes","discipline":"both","def":"Also known as a local interneuron: a neuron that has short axons and synapse exclusively with nearby neurons. In the cortex the term is often used to refer to inhibitory neurons.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"pyramidal-cell","term":"Pyramidal cell","category":"celltypes","discipline":"both","def":"A type of excitatory neuron with a characteristic cell body shape and apical dendrite. In visual cortex, pyramidal cells are by far the most common type of excitatory neuron.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"gaba","term":"GABA","category":"celltypes","discipline":"both","def":"Gamma-aminobutyric acid (GABA) is the main inhibitory neurotransmitter in the mammalian brain. In cortex, most GABAergic neurons are local interneurons.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"fast-spiking-neuron","term":"Fast spiking neuron (FSN)","category":"celltypes","discipline":"physiology","def":"Fast spiking neurons are so called because of their \"narrow,\" fast action potentials, specifically as seen in intracellular recordings of a cell in response to a prolonged step of current. Additionally, with sufficient current injection fast spiking neurons exhibit fast spike rates, and do not show frequency adaptation, or slowing of spike rates, over time. In unlabeled extracellular recordings, units with narrow action potentials are also referred to as fast spiking neurons. This feature is sometimes used to putatively label neurons with narrow spikes as particular cell types, such as PV+ neurons, among others.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"diagram":"fast-spiking-neuron","ng":{}},
  {"id":"regular-spiking-neuron","term":"Regular spiking neuron (RS)","category":"celltypes","discipline":"physiology","def":"Neurons that, when injected with a long step of current in the context of intracellular recordings, show spike frequency adaptation where the rate of spiking decreases over time. These neurons also have longer (or wider) action potentials, and lower spike rates even when injected with large currents due to hyperpolarization after each action potential. These are the most common type of neurons in the mammalian cortex, and are often associated excitatory neurons. In extracellular recordings, neurons with longer action potentials are also sometimes referred to as regular spiking neurons, a feature which is used to associate these units with specific cell types, such as excitatory pyramidal neurons among others.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"pv-neuron","term":"Parvalbumin-positive (PV+) neuron","category":"celltypes","discipline":"both","def":"Fast spiking neurons, also known as fast spiking interneurons, is a short-hand for parvalbumin positive GABA-ergic inhibitory interneurons found in many brain regions that have strong inhibitory effects on neighboring cells. In experimental preparations where the genetic identity of neurons can be paired with electrophysiological recordings, PV+ neurons have short action potentials, occasionally less than 400 µS.","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}},
  {"id":"saccade","term":"Saccade","category":"celltypes","discipline":"physiology","def":"A rapid and ballistic eye movement that shifts the visual field between two fixation points. Mice are not foveal animals, and their eye movements are different from foveal animals (such as humans).","source":{"label":"databook glossary","url":"https://allenswdb.github.io/glossary.html"},"ng":{}}
];

</script>
<script>
// tables.js — the CAVE annotation tables most analyses start from, one
// catalogue per dataset. Row counts are read off each dataset's published
// table listing; see the references in data/config.js.
//
// Groups say what a table records, and each has its own colour so the whole
// catalogue reads at a glance. They carry no ordering: a table is not
// "downstream" of the column to its left.
//
// To add a Neuroglancer state for a table, put the URL in its `ng` field.

// Groups are per discipline. The two palettes never share a screen — the
// discipline filter selects one — and on the printed sheet each discipline's
// section carries its own legend directly above it.

<script>
// snippets.js — short recipes shown on the Tables page and on the printed sheet.
//
// Each snippet carries one block per language. Only the languages present here
// get a tab, so adding an "r" key to a snippet is all it takes to light up an
// R tab for it — nothing in the site needs changing.

window.LANGUAGES = [
  { id: "python", label: "Python" },
  { id: "r",      label: "R" },
];

// `disc` scopes a snippet to one discipline; omit it and it shows in both.
window.SNIPPETS = [
  {
    id: "setup",
    disc: "connectomics",
    title: "Connect to a datastack",
    python: `from caveclient import CAVEclient

# MICrONS
client = CAVEclient("minnie65_public")

# V1DD — different server, so authenticate against it separately
client = CAVEclient("v1dd_public",
                    server_address="https://global.em.brain.allentech.org")

client.materialize.version          # the snapshot you are querying`,
  },
  {
    id: "connectivity",
    disc: "connectomics",
    title: "Synapses of one neuron, collapsed to connections",
    python: `# outputs of a cell (use post_ids= for its inputs)
syn = client.materialize.synapse_query(pre_ids=my_root_id)

# one row per pre -> post pair, with a synapse count
(syn.groupby(["pre_pt_root_id", "post_pt_root_id"])
    .count()[["id"]]
    .rename(columns={"id": "syn_count"})
    .sort_values("syn_count", ascending=False))

# then keep only proofread axons and join a cell-type table on pt_root_id`,
  },
  {
    id: "query",
    disc: "connectomics",
    title: "Query a table",
    python: `client.materialize.query_table(
    "nucleus_detection_v0",
    filter_in_dict={"id": my_nucleus_ids},
    desired_resolution=[1000, 1000, 1000],   # nm per unit -> microns
    select_columns=["id", "pt_position", "pt_root_id"],
    split_positions=True,
)
# returns at most 200,000 rows — filter, do not paginate blindly`,
  },
  {
    id: "proofread",
    disc: "connectomics",
    title: "Restrict to proofread arbors",
    python: `pr = client.materialize.query_table("proofreading_status_and_strategy")

clean_axons = pr[pr.status_axon]        # merges removed; may be incomplete
complete    = pr[pr.strategy_axon.isin(["axon_fully_extended",
                                        "axon_interareal"])]

# valid_id is the root id at the time of assessment — if it differs from the
# current pt_root_id, the cell has been edited since.`,
  },

  /* ── physiology ─────────────────────────────────────────────── */
  {
    id: "open",
    disc: "physiology",
    title: "Open a session",
    python: `from hdmf_zarr import NWBZarrIO

nwb = NWBZarrIO(session_path, "r").read()

# the same seven places in every file, whatever the experiment was
nwb.subject                        # who
nwb.devices, nwb.electrodes        # what recorded it
nwb.acquisition                    # signals as acquired
nwb.stimulus                       # what was presented
nwb.intervals                      # epochs, trials, blocks
nwb.processing                     # anything derived
nwb.units[:]                       # sorted units, ephys only

# print the tree before assuming a path: layouts differ between datasets
list(nwb.intervals), list(nwb.processing), list(nwb.stimulus)`,
  },
  {
    id: "quality",
    disc: "physiology",
    title: "Filter units by quality",
    python: `units = nwb.units[:]

good = units[(units.isi_violations < 0.5) &     # contamination
             (units.amplitude_cutoff < 0.1) &   # spikes missed
             (units.presence_ratio > 0.9)]      # present all session

# newer files carry default_qc, which is the pipeline's own verdict:
good = units[units.default_qc]

# thresholds are a choice, not a fact. Loosen them if you do not need
# well-isolated units, tighten them if you do.`,
  },
  {
    id: "psth",
    disc: "physiology",
    title: "Align spikes to a stimulus",
    python: `import numpy as np

trials = nwb.intervals["trials"][:]
onsets = trials.loc[trials.is_vis_target, "stim_start_time"].values

bins = np.arange(-0.2, 0.5, 0.01)              # s, relative to onset
spikes = nwb.units["spike_times"][unit_row]
counts = np.stack([np.histogram(spikes - t, bins)[0] for t in onsets])

psth = counts.mean(0) / np.diff(bins)          # spikes / s`,
  },
  {
    id: "locate",
    disc: "physiology",
    title: "Give a unit a brain area",
    python: `units = nwb.units[:]
electrodes = nwb.electrodes[:]           # general/extracellular_ephys

# a unit points at the electrodes its waveform appeared on; the strongest
# one carries its location. Some files precompute this as unit columns
# (ccf_ap / ccf_dv / ccf_ml, brain_region) — check before you join.
units["peak_electrode"] = [e[0] for e in units["electrodes"]]
located = units.merge(electrodes, left_on="peak_electrode", right_index=True)

located[["firing_rate", "structure", "x", "y", "z"]].head()`,
  },
];

</script>
