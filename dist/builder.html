<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheat sheet builder — Allen Glossary</title>
<meta name="description" content="Pick terms, edit them, and place them by hand on printed pages.">
<style>
  :root{
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --ink:#161b22; --muted:#4b5563; --faint:#8b93a0; --line:#dde2e8; --line2:#c7cdd6;
    --paper:#ffffff; --panel:#f4f6f8; --accent:#0d7d88; --accent-ink:#0a5a63;
    --app-bg:#e7ebf0; --chrome:#11161d; --chrome-ink:#e7edf3; --chrome-mut:#9aa4b2;
    --sel:#0d7d88; --danger:#c0392b;
    /* colour inside an illustration means anatomy and nothing else */
    --neuron:#39424f; --axon:#b07a2b; --dendrite:#3f6fa8; --synapse:#c04a6e;
    --error:#c0392b; --ok:#2a8f57; --scaffold:#7c8695;
    --st-functional:var(--ok);
    --surface:#ffffff; --surface-2:#f4f6f8; --border:#dde2e8; --border-strong:#c7cdd6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--app-bg);color:var(--ink);font-family:var(--font-sans);font-size:14px}
  svg text{font-family:var(--font-sans)} svg .mono{font-family:var(--font-mono)}

  /* ---------- chrome / stepper ---------- */
  .chrome{position:sticky;top:0;z-index:100;background:var(--chrome);color:var(--chrome-ink);border-bottom:1px solid #000}
  .chrome-in{max-width:1180px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .chrome h1{font-size:.95rem;margin:0;font-weight:700;letter-spacing:-.01em}
  .chrome h1 .em{color:var(--accent)}
  .steps{display:flex;gap:.3rem;margin-left:.5rem}
  .step{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--chrome-mut);background:transparent;border:1px solid #2a323d;border-radius:999px;padding:.3rem .7rem;cursor:pointer}
  .step .n{font-family:var(--font-mono);font-size:.66rem;width:1.15rem;height:1.15rem;border-radius:50%;display:grid;place-items:center;background:#2a323d;color:var(--chrome-ink)}
  .step.active{color:var(--chrome-ink);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,transparent)}
  .step.active .n{background:var(--accent)}
  .step.done .n{background:var(--st-functional)}
  .chrome .spacer{margin-left:auto}
  .btn{font-family:var(--font-sans);font-size:.8rem;border-radius:7px;padding:.4rem .8rem;border:1px solid var(--border-strong);background:var(--paper);color:var(--ink);cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{background:var(--accent-ink)}
  .btn.ghost{background:transparent;color:var(--chrome-ink);border-color:#2a323d}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.sm{font-size:.72rem;padding:.25rem .55rem}

  .view{max-width:1180px;margin:0 auto;padding:1rem}
  .view[hidden]{display:none}
  .toolbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;position:sticky;top:3.1rem;z-index:40}
  .toolbar input[type=search]{font-family:var(--font-sans);font-size:.82rem;border:1px solid var(--border-strong);border-radius:7px;padding:.35rem .6rem;min-width:180px}
  .toolbar .count{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
  .catfilters{display:flex;gap:.25rem;flex-wrap:wrap}
  .catf{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.03em;border:1px solid var(--line2);border-radius:999px;padding:.2rem .5rem;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:.3rem;background:var(--paper)}
  .catf i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .catf.off{opacity:.35}

  /* ---------- select grid ---------- */
  .selgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem}
  .selcard{position:relative;background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--cc,var(--line2));border-radius:9px;padding:.55rem .6rem;cursor:pointer;display:flex;flex-direction:column;gap:.3rem;transition:box-shadow .1s}
  .selcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .selcard.on{outline:2px solid var(--sel);outline-offset:-1px;border-left-color:var(--sel)}
  .selcard .chk{position:absolute;top:.4rem;right:.4rem;width:1.15rem;height:1.15rem;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--paper);display:grid;place-items:center;font-size:.7rem;color:#fff}
  .selcard.on .chk{background:var(--sel);border-color:var(--sel)}
  .selcard .eb{font-family:var(--font-mono);font-size:.55rem;font-weight:700;letter-spacing:.05em;color:var(--cc,var(--muted))}
  .selcard .nm{font-size:.86rem;font-weight:700;line-height:1.1;padding-right:1.2rem}
  .selcard .df{font-size:.72rem;color:var(--muted);line-height:1.25;max-height:3.8em;overflow:hidden}
  .selcard .art{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px 3px}
  .selcard .art svg{display:block;width:100%;height:auto}
  .selcard .df code{font-family:var(--font-mono);font-size:.66rem;background:var(--panel);padding:0 .2em;border-radius:3px}
  .selcard.special{border-style:dashed}

  /* ---------- edit list ---------- */
  .editlist{display:flex;flex-direction:column;gap:.55rem}
  .editrow{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--cc,var(--line2));border-radius:9px;padding:.6rem .7rem;display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:start}
  .editrow .ord{display:flex;flex-direction:column;gap:.15rem}
  .editrow .ord .btn{padding:.1rem .4rem;font-size:.7rem;line-height:1}
  .editrow .fields{display:flex;flex-direction:column;gap:.35rem;min-width:0}
  .editrow .eb{font-family:var(--font-mono);font-size:.58rem;font-weight:700;letter-spacing:.05em;color:var(--cc,var(--muted))}
  .editrow input.nm{font:700 .9rem var(--font-sans);border:1px solid var(--border-strong);border-radius:6px;padding:.3rem .5rem}
  .editrow textarea.df{font:.8rem/1.35 var(--font-sans);border:1px solid var(--border-strong);border-radius:6px;padding:.35rem .5rem;resize:vertical;min-height:2.4rem}
  .editrow .side{display:flex;flex-direction:column;gap:.35rem;align-items:flex-end;min-width:110px}
  .editrow .art{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:2px 3px;width:110px}
  .editrow .art svg{display:block;width:100%;height:auto}
  .editrow label.tog{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:.3rem;cursor:pointer}
  .editrow.hidden-diag .art{opacity:.3}

  /* ---------- arrange ---------- */
  .arrbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;position:sticky;top:3.1rem;z-index:60;margin-bottom:.8rem}
  .arrbar .sep{width:1px;height:1.3rem;background:var(--line2)}
  .arrbar .fitmsg{font-family:var(--font-mono);font-size:.72rem;color:var(--muted)}
  .arrbar .fitmsg.over{color:var(--danger);font-weight:700}
  .arrbar .fitmsg.ok{color:var(--st-functional);font-weight:700}
  .margctl{display:flex;align-items:center;gap:.3rem;font-size:.72rem;color:var(--muted)}
  .margctl input[type=range]{width:68px}
  .selbox-tools{display:flex;align-items:center;gap:.4rem;font-size:.74rem;color:var(--muted)}
  .selbox-tools input[type=range]{width:120px}
  .pages{display:flex;flex-direction:column;align-items:center;gap:1.2rem;padding-bottom:3rem}
  .pagewrap{display:flex;flex-direction:column;gap:.25rem;align-items:center}
  .pagelbl{font-family:var(--font-mono);font-size:.66rem;color:var(--muted)}
  .page{width:8.5in;height:11in;background:var(--paper);box-shadow:0 3px 18px rgba(0,0,0,.28);position:relative;overflow:hidden}
  .page-inner{position:absolute;top:var(--pg-vm,.4in);right:var(--pg-hm,.4in);bottom:var(--pg-vm,.4in);left:var(--pg-hm,.4in)}
  .page.over .page-inner{outline:2px dashed var(--danger);outline-offset:6px}
  .box{position:absolute;transform-origin:top left;cursor:grab;touch-action:none}
  .box.dragging{cursor:grabbing;z-index:9999!important}
  .box.selected .content{outline:2px solid var(--sel);outline-offset:2px}
  .box .content{border:1px solid var(--line);border-left:3px solid var(--cc,var(--line2));border-radius:7px;background:var(--paper);padding:4px 6px 6px;overflow:hidden}
  .box .content .eb{font-family:var(--font-mono);font-size:6.5px;font-weight:700;letter-spacing:.05em;color:var(--cc,var(--muted))}
  .box .content .nm{font-size:11px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
  .box .content .df{font-size:8.5px;color:var(--muted);line-height:1.25;margin-top:1px}
  .box .content .df code{font-family:var(--font-mono);font-size:7.5px;background:var(--panel);padding:0 .2em;border-radius:3px}
  .box .content .art{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:2px 3px;margin-top:2px}
  .box .content .art svg{display:block;width:100%;height:auto}
  .box .rh{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;border-radius:3px;background:var(--sel);border:2px solid #fff;cursor:nwse-resize;display:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .box.selected .rh{display:block}
  .box .pgbadge{position:absolute;left:-6px;top:-6px;width:16px;height:16px;border-radius:50%;background:var(--chrome);color:#fff;font:700 8px var(--font-mono);display:none;place-items:center}
  .box.selected .pgbadge{display:grid}

  /* special content renders */
  /* table catalogue block — grouped by what a table records, no ordering implied */
  .content.special .tblblock{columns:2 1.5in;column-gap:6px}
  .content.special .tbg{break-inside:avoid;display:inline-block;width:100%;margin-bottom:4px}
  .content.special .tbh{font-family:var(--font-mono);font-size:5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);margin-bottom:1.5px}
  .content.special .tbr{border-left:2px solid var(--line2);padding-left:3px;margin-bottom:1.5px}
  .content.special .tbn{font-family:var(--font-mono);font-size:5px;font-weight:700;line-height:1.15;word-break:break-all}
  .content.special .tbk{font-family:var(--font-mono);font-size:4.2px;color:var(--faint);line-height:1.15;word-break:break-word}
  .content.special pre.pandas{margin:0;background:#0e141b;color:#dbe4ee;border-radius:5px;padding:5px 6px;overflow:hidden;font-family:var(--font-mono);font-size:6.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .content.special pre.pandas .c{color:#7b8798}.content.special pre.pandas .fn{color:#5fd0dd}.content.special pre.pandas .s{color:#e3a56b}
  .content.special .notesgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px}
  .content.special .notesgrid div{font-size:6.5px;color:var(--muted);line-height:1.25}
  .content.special .notesgrid b{font-family:var(--font-mono);font-size:5.8px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);display:block}
  .content.special .notesgrid code{font-family:var(--font-mono);background:var(--panel);padding:0 .2em;border-radius:3px}

  .empty{padding:3rem 1rem;text-align:center;color:var(--muted)}
  .empty .big{font-size:1.1rem;color:var(--ink);margin-bottom:.4rem}

  @media print{
    @page{size:letter portrait;margin:0}
    html,body{background:#fff}
    .chrome,.arrbar,.toolbar{display:none!important}
    .view{max-width:none;margin:0;padding:0}
    .pages{gap:0;padding:0}
    .pagewrap{gap:0}
    .pagelbl{display:none}
    .page{box-shadow:none;page-break-after:always;width:8.5in;height:11in}
    .pagewrap:last-child .page{page-break-after:auto}
    .box .rh,.box .pgbadge{display:none!important}
    .box.selected .content{outline:none}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }

</style>
</head>
<body>

<div class="chrome">
  <div class="chrome-in">
    <h1><span class="em">Cheat sheet</span> builder</h1>
    <div class="steps">
      <button class="step active" data-step="0" id="st0"><span class="n">1</span>Select</button>
      <button class="step" data-step="1" id="st1"><span class="n">2</span>Edit</button>
      <button class="step" data-step="2" id="st2"><span class="n">3</span>Arrange &amp; print</button>
    </div>
    <div class="spacer"></div>
    <a class="btn ghost sm" href="#" onclick="return false" title="not available in the single-file bundle">← Glossary</a>
    <button class="btn ghost sm" id="resetBtn" title="Clear all selections and edits">Reset</button>
    <button class="btn primary" id="nextBtn">Next: Edit →</button>
  </div>
</div>

<!-- STEP 1 -->
<section class="view" id="view0">
  <div class="toolbar">
    <input type="search" id="search" placeholder="Search terms…" aria-label="Search terms">
    <div class="catfilters" id="catfilters"></div>
    <span class="spacer" style="flex:1"></span>
    <button class="btn sm" id="selAll">Select all shown</button>
    <button class="btn sm" id="selNone">Clear</button>
    <span class="count" id="selCount">0 selected</span>
  </div>
  <div class="selgrid" id="selgrid"></div>
</section>

<!-- STEP 2 -->
<section class="view" id="view1" hidden>
  <div class="toolbar">
    <span class="count" id="editCount">0 boxes</span>
    <span style="color:var(--muted);font-size:.78rem">Edit the name and definition of each box; reorder with ↑↓; toggle its diagram. Changes autosave.</span>
  </div>
  <div class="editlist" id="editlist"></div>
</section>

<!-- STEP 3 -->
<section class="view" id="view2" hidden>
  <div class="arrbar">
    <button class="btn sm" id="autoAll">Auto-arrange</button>
    <button class="btn sm" id="autoFit">Auto-fit</button>
    <div class="sep"></div>
    <span class="margctl">Pages
      <button class="btn sm" id="delPage" title="Remove the last page">−</button>
      <span id="pageCount" style="font-family:var(--font-mono);min-width:4rem">2 pages</span>
      <button class="btn sm" id="addPage" title="Add a page">+</button>
    </span>
    <div class="sep"></div>
    <label class="margctl">Side <input type="range" id="hMargin" min="0.10" max="1.0" step="0.05" value="0.40"> <span id="hMarginVal" style="font-family:var(--font-mono);min-width:2.8rem">0.40″</span></label>
    <label class="margctl">Top/btm <input type="range" id="vMargin" min="0.10" max="1.0" step="0.05" value="0.40"> <span id="vMarginVal" style="font-family:var(--font-mono);min-width:2.8rem">0.40″</span></label>
    <div class="sep"></div>
    <div class="selbox-tools" id="selTools" style="visibility:hidden">
      <span id="selName">—</span>
      <label>scale <input type="range" id="scaleRange" min="0.4" max="2" step="0.05" value="1"></label>
      <span id="scaleVal" style="font-family:var(--font-mono)">1.00×</span>
      <select id="toPage" aria-label="Move to page"></select>
      <button class="btn sm" id="toFront">Front</button>
    </div>
    <span class="spacer" style="flex:1"></span>
    <span class="fitmsg" id="fitMsg"></span>
    <div class="sep"></div>
    <button class="btn primary sm" id="printBtn">Print / Save PDF</button>
  </div>
  <div class="pages" id="pages"></div>
</section>

<script>
// config.js — disciplines, datasets, categories, and the colour rules for the site.
// Plain data. Edit values freely; leave the "window.X =" wrappers alone so the
// files keep working when index.html is opened straight off disk (file://).

window.SITE = {
  title: "Allen Glossary",
  // shown in the footer; bump when you make a change worth flagging to readers
  revision: "2026-08",
  // listed in the footer as further reading. A definition that leans on one
  // particular source should carry its own "source" field instead.
  references: [
    { label: "SWDB databook",            url: "https://allenswdb.github.io/" },
    { label: "MICrONS Explorer",         url: "https://www.microns-explorer.org/" },
    { label: "CAVEclient documentation", url: "https://caveconnectome.github.io/CAVEclient/" },
    { label: "NWB",                      url: "https://nwb.org/" },
    { label: "AIND open data on S3",     url: "https://registry.opendata.aws/allen-nd-open-data/" },
  ],
  // the Community tab opens this in a new tab; clear it to drop the tab
  community: "https://community.brain-map.org/",
  // where "Suggest a change" files its issue. owner/name of the repository the
  // reader should be able to open an issue on; clear it to drop the button.
  repo: "AllenInstitute/allen-connectomics-glossary",
};

// The top-level lens. Everything below — categories, datasets, table groups —
// declares which discipline it belongs to, and "all" simply drops the filter.
window.DISCIPLINES = [
  { id: "connectomics", label: "Connectomics", blurb: "Electron-microscopy volumes, segmentation, and the CAVE annotation tables built on them." },
  { id: "physiology",   label: "Physiology",   blurb: "Two-photon and Neuropixels recordings of activity and behaviour, packaged as NWB." },
];

window.DATASETS = {
  /* ── connectomics ─────────────────────────────────────────────── */
  microns: {
    discipline: "connectomics",
    label: "MICrONS",
    blurb: "Cubic-millimetre serial-section EM of mouse visual cortex (VISp / VISal / VISrl), with matched two-photon calcium imaging.",
    datastack: "minnie65_public",
    server: "global.daf-apis.com",
    resolution: "4 × 4 × 40 nm",
    version: "v1507",
    synapses: "synapses_pni_2",
    ng: "https://spelunker.cave-explorer.org/#!middleauth+https://global.daf-apis.com/nglstate/api/v1/4658335189041152",
  },
  v1dd: {
    discipline: "connectomics",
    label: "V1DD",
    blurb: "V1 Deep-Dive: 800 × 800 µm of primary visual cortex spanning pia to white matter, imaged in 4 mice; EM in the same tissue.",
    datastack: "v1dd_public",
    server: "global.em.brain.allentech.org",
    resolution: "9 × 9 × 45 nm",
    version: "v1196",
    synapses: "synapses_v1dd",
    ng: "https://spelunker.cave-explorer.org/#!middleauth+https://global.em.brain.allentech.org/nglstate/api/v1/6116368998989824",
  },

  /* ── physiology ─────────────────────────────────────────────────
     Everything here is an NWB file. `asset` names the exact object whose
     structure the Tables view describes — read with
     `aws s3 cp --no-sign-request s3://aind-open-data/<asset>/.zmetadata -`,
     so anything shown there can be checked against the file itself.
     The AllenSDK project caches are deliberately not represented: they are
     being retired in favour of reading NWB directly.                     */
  v1dd_ophys: {
    discipline: "physiology",
    label: "V1 Deep Dive (2P)",
    blurb: "The two-photon side of V1DD: a ~1 mm³ volume of V1 imaged column by column in 4 mice. One mouse was then reconstructed in EM, which is what links this dataset to the connectomics side.",
    access: "NWBZarrIO",
    backend: "NWB / Zarr",
    asset: "409828_2018-11-06_14-02-59_filtered_2026-04-09_04-59-00",
    stats: [
      { v: "6", l: "imaging planes", sub: "one volume, 16 µm apart" },
      { n: 33214, l: "stimulus presentations", sub: "intervals/stimulus_table" },
      { v: "11", l: "epochs", sub: "intervals/epochs" },
    ],
  },
  bci: {
    discipline: "physiology",
    label: "Brain Computer Interface",
    blurb: "Layer 2/3 of motor cortex imaged while a mouse drives a lickport with the activity of one conditioned neuron, with single-cell photostimulation before and after to measure what learning changed.",
    access: "NWBZarrIO",
    backend: "NWB / Zarr",
    asset: "single-plane-ophys_731015_2025-01-10_18-06-31_processed_2025-08-03_20-39-09",
    stats: [
      { n: 1214, l: "segmented ROIs", sub: "one plane" },
      { v: "65", l: "BCI trials" },
      { n: 2567, l: "photostim trials" },
    ],
  },
  df: {
    discipline: "physiology",
    label: "Dynamic Foraging",
    blurb: "Behaviour-only sessions of a two-choice probabilistic reward task with non-stationary reward probabilities, spanning the training curriculum. The simplest NWB file here: no units, no imaging.",
    access: "NWBZarrIO",
    backend: "NWB / Zarr",
    asset: "behavior_761433_2025-03-27_08-51-54_processed_2025-03-28_05-00-28",
    stats: [
      { v: "1", l: "table", sub: "intervals/trials" },
      { v: "4", l: "acquisition series", sub: "licks and rewards" },
      { n: 400, l: "sessions released" },
    ],
  },
  npultra: {
    discipline: "physiology",
    label: "NP Ultra & Psychedelics",
    blurb: "Ultra-high-density Neuropixels spanning cortical depth, probing how psilocybin changes population activity. The 6 µm site pitch is what makes the fine waveform measures possible.",
    access: "NWBZarrIO",
    backend: "NWB / Zarr",
    asset: "ecephys_714527_2024-05-15_13-00-23_nwb_2025-08-03_21-11-22",
    stats: [
      { n: 719, l: "units", sub: "556 curated" },
      { n: 1536, l: "electrodes", sub: "4 probes" },
      { n: 6969, l: "visual presentations" },
    ],
  },
  dr: {
    discipline: "physiology",
    label: "Dynamic Routing",
    blurb: "Brain-wide Neuropixels recordings while mice perform a context-dependent go/no-go task: visual and auditory blocks alternate, and the same stimulus is a target or not depending on which block it is.",
    access: "NWBZarrIO",
    backend: "NWB / Zarr",
